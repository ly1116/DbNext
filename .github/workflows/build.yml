name: Build DataRoost (Windows + macOS + Linux)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_windows:
        description: "同时构建 Windows NSIS 安装包"
        required: false
        default: "true"
      build_macos:
        description: "构建 macOS (x64 + arm64) DMG"
        required: false
        default: "true"
      build_linux:
        description: "构建 Linux (x64) AppImage + deb"
        required: false
        default: "true"

# 允许工作流把产物作为真实文件发布到 GitHub Release
permissions:
  contents: write

jobs:
  # —— macOS Intel DMG（在 macOS runner 上构建，electron-builder 不支持跨平台打 Mac 包）——
  macos:
    if: ${{ github.event_name == 'push' || inputs.build_macos != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build main process
        run: npm run build:main

      # 顺序两次单架构构建（不能在单个 electron-builder 调用里同时 --x64 --arm64）。
      # x64 之前先清掉 release/，避免上次构建残留干扰。
      # 注意：未签名发布时故意不传 CSC_LINK / APPLE_* 这些 env。
      # 当对应 secret 缺失时它们会被渲染成空字符串，而 electron-builder 只要看到
      # CSC_LINK 这个 key 存在（哪怕为空）就会进入证书加载流程，把空路径解析成
      # 工作目录，最终报 "not a file" 而失败。拿到 Apple Developer ID 证书后，
      # 再把 CSC_LINK / CSC_KEY_PASSWORD / APPLE_* 加回来即可开启签名 + 公证。
      - name: Build macOS DMG (Intel x64)
        run: rm -rf release && npx electron-builder --mac --x64 --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build macOS DMG (Apple Silicon arm64)
        run: npx electron-builder --mac --arm64 --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS DMG to Release (real file, not zip)
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/') }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'DataRoost Continuous Build' }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'true' }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

      - name: Upload macOS artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: dataroost-macos-x64
          path: release/*.dmg
          if-no-files-found: error

  # —— Windows NSIS（可选）——
  windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build main process
        run: npm run build:main

      - name: Build Windows NSIS (with install-directory chooser)
        run: npx electron-builder --win --x64 --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows EXE to Release (real file, not zip)
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/') }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'DataRoost Continuous Build' }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'true' }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            release/dataroost-*-windows-x64.exe
            release/latest.yml

      - name: Upload Windows artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: dataroost-windows-x64
          path: release/dataroost-*-windows-x64.exe
          if-no-files-found: error

  # —— Linux AppImage + deb（在 ubuntu runner 上构建）——
  linux:
    if: ${{ github.event_name == 'push' || inputs.build_linux != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build main process
        run: npm run build:main

      - name: Build Linux AppImage + deb
        run: npx electron-builder --linux --x64 --publish=never

      - name: Upload Linux binaries to Release (real files)
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/') }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'DataRoost Continuous Build' }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'true' }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

      - name: Upload Linux artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: dataroost-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
