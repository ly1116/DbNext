<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DbNest</title>
<style>
:root{
  --bg:#FFFFFF; --p1:#FAFAFA; --p2:#F4F4F5; --hov:#EFEFF1;
  --line:#E4E4E7; --soft:#EFEFF1; --line2:#D4D4D8;
  --fg:#18181B; --fg2:#3F3F46; --fg3:#71717A; --fg4:#A1A1AA;
  --ok:#16A34A; --warn:#D97706; --dgr:#DC2626;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Microsoft YaHei",sans-serif;
  --sh:0 10px 32px rgba(24,24,27,.14),0 2px 8px rgba(24,24,27,.08);
}
html.dark{
  --bg:#131316; --p1:#17171B; --p2:#1C1C21; --hov:#232329;
  --line:#26262C; --soft:#202025; --line2:#3A3A42;
  --fg:#EDEDF0; --fg2:#B6B6BE; --fg3:#8A8A94; --fg4:#5F5F69;
  --ok:#22C55E; --warn:#F59E0B; --dgr:#EF4444;
  --sh:0 12px 36px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);font-size:12px;line-height:1.45;color:var(--fg);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden}
svg{display:block;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
input,textarea{font:inherit;color:inherit}
::selection{background:rgba(24,24,27,.14)}
html.dark ::selection{background:rgba(237,237,240,.2)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid transparent;background-clip:content-box;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--fg4);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

.app{display:flex;flex-direction:column;height:100vh}

/* ── 顶栏 44 ── */
.top{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;
  border-bottom:1px solid var(--line);background:var(--p1);position:relative;z-index:30}
.mark{width:22px;height:22px;border-radius:5px;background:var(--fg);color:var(--bg);
  display:flex;align-items:center;justify-content:center}
.name{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.vsep{width:1px;height:14px;background:var(--line)}
.env{display:flex;align-items:center;gap:6px;height:26px;padding:0 7px 0 5px;border-radius:5px;
  border:1px solid transparent;color:var(--fg2)}
.env:hover{background:var(--p2);border-color:var(--line)}
.env b{font-size:12px;font-weight:600;color:var(--fg)}
.env .m{font-size:10.5px;color:var(--fg4);font-family:var(--mono)}
.grow{flex:1}
.omni{display:flex;align-items:center;gap:6px;height:26px;width:230px;padding:0 5px 0 7px;
  border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg4)}
.omni:hover{border-color:var(--line2)}
.omni span{font-size:11.5px}
.kbd{font-family:var(--mono);font-size:9.5px;line-height:16px;padding:0 4px;border-radius:3px;
  border:1px solid var(--line);background:var(--p2);color:var(--fg4)}
.ib{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  color:var(--fg3);transition:background .1s,color .1s}
.ib:hover{background:var(--p2);color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 9px;
  border:1px solid var(--line);border-radius:5px;background:var(--bg);
  font-size:11.5px;font-weight:500;color:var(--fg);white-space:nowrap;transition:background .1s}
.btn:hover{background:var(--p2)}
.btn:active{background:var(--hov)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.pri{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.pri:hover{background:var(--fg);opacity:.88}
.ghost{border-color:transparent;color:var(--fg3)}
.ghost:hover{background:var(--p2);color:var(--fg)}
.dgr{color:#B91C1C}
.dgr:hover{background:#FEF2F2;border-color:#FECACA}
html.dark .dgr{color:#F87171}
html.dark .dgr:hover{background:#2A1518;border-color:#5A2429}
.sm{height:24px;padding:0 7px;font-size:11px;border-radius:4px}

/* ── 主体 ── */
.mid{flex:1;display:flex;min-height:0}

/* 模块栏 48 */
.rail{width:48px;flex:none;background:var(--p1);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:1px}
.rb{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--fg3);position:relative}
.rb:hover{background:var(--hov);color:var(--fg)}
.rb[aria-current]{background:var(--fg);color:var(--bg)}
.rb[aria-current]:hover{background:var(--fg);color:var(--bg)}
.rb i{position:absolute;left:38px;top:50%;transform:translateY(-50%);background:var(--fg);color:var(--bg);
  font-style:normal;font-size:11px;line-height:1;padding:5px 7px;border-radius:4px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .1s .3s;z-index:80}
.rb:hover i{opacity:1}
.rsep{width:20px;height:1px;background:var(--line);margin:4px 0}

/* 上下文 216 */
.ctx{width:216px;flex:none;background:var(--p1);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.ch{height:32px;flex:none;display:flex;align-items:center;gap:4px;padding:0 5px 0 9px;
  border-bottom:1px solid var(--line)}
.ch b{font-size:10px;font-weight:600;color:var(--fg4);letter-spacing:.05em}
.cb{flex:1;overflow:auto;min-height:0;padding:4px}
.cf{height:24px;flex:none;display:flex;align-items:center;gap:6px;padding:0 9px;
  border-top:1px solid var(--line);font-size:10px;color:var(--fg4);font-variant-numeric:tabular-nums}

.nd{display:flex;align-items:center;gap:5px;height:25px;padding:0 5px;border-radius:4px;
  color:var(--fg2);font-size:11.5px;position:relative;user-select:none}
.nd:hover{background:var(--hov)}
.nd[aria-selected="true"]{background:var(--bg);color:var(--fg);font-weight:500;
  box-shadow:inset 0 0 0 1px var(--line),0 1px 2px rgba(24,24,27,.05)}
html.dark .nd[aria-selected="true"]{box-shadow:inset 0 0 0 1px var(--line2)}
.nd .cv{width:10px;height:10px;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--fg4);transition:transform .1s}
.nd[data-exp="1"] .cv{transform:rotate(90deg)}
.nd .ic{color:var(--fg4);flex:none}
.nd[aria-selected="true"] .ic{color:var(--fg)}
.nd .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd .n{font-size:10px;color:var(--fg4);font-variant-numeric:tabular-nums}
.nd .dt{width:5px;height:5px;border-radius:50%;flex:none}
.nd.d1{padding-left:16px}
.nd.d2{padding-left:28px}
.nd.d3{padding-left:40px}
.nd.d1::before,.nd.d2::before,.nd.d3::before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.nd.d1::before{left:9px}.nd.d2::before{left:21px}.nd.d3::before{left:33px}
.ngrp{display:flex;align-items:center;gap:5px;padding:8px 6px 3px;font-size:10px;
  font-weight:600;color:var(--fg4);letter-spacing:.04em}
.ngrp .l{flex:1;height:1px;background:var(--line)}

/* ── 主区 ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}

/* 标签 30 */
.tabs{height:30px;flex:none;display:flex;align-items:stretch;background:var(--p1);
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:5px;padding:0 6px 0 8px;border-right:1px solid var(--line);
  font-size:11px;color:var(--fg3);position:relative;white-space:nowrap;min-width:0;background:var(--p1)}
.tab:hover{background:var(--p2);color:var(--fg2)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--fg);font-weight:500}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--fg)}
.tab .tx{width:14px;height:14px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  color:var(--fg4);opacity:0;flex:none}
.tab:hover .tx,.tab[aria-selected="true"] .tx{opacity:1}
.tab .tx:hover{background:var(--hov);color:var(--fg)}
.tab .dt{width:5px;height:5px;border-radius:50%;background:var(--fg3);flex:none}
.tadd{width:26px;display:flex;align-items:center;justify-content:center;color:var(--fg4);flex:none}
.tadd:hover{background:var(--p2);color:var(--fg)}
.tfill{flex:1;min-width:6px}

/* 工具行 36 */
.bar{height:36px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;
  border-bottom:1px solid var(--line)}
.fld{display:flex;align-items:center;gap:5px;height:24px;padding:0 6px;border:1px solid var(--line);
  border-radius:4px;color:var(--fg4);background:var(--bg);min-width:0}
.fld:focus-within{border-color:var(--fg);box-shadow:0 0 0 3px rgba(24,24,27,.07)}
html.dark .fld:focus-within{box-shadow:0 0 0 3px rgba(237,237,240,.08)}
.fld input{border:0;outline:0;background:none;width:100%;font-size:11.5px;color:var(--fg)}
.fld input::placeholder{color:var(--fg4)}
.seg{display:inline-flex;height:24px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{display:flex;align-items:center;gap:4px;padding:0 7px;font-size:11px;color:var(--fg3);
  border-right:1px solid var(--line);background:var(--bg)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--p2);color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.meta{font-family:var(--mono);font-size:10px;color:var(--fg4);font-variant-numeric:tabular-nums}

/* 未保存更改条 */
.pending{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;background:var(--p2);
  border-bottom:1px solid var(--line);font-size:11px;color:var(--fg2)}
.pending b{font-weight:600;color:var(--fg)}
.pdt{width:5px;height:5px;border-radius:50%;background:var(--warn)}

/* ── 网格 ── */
.gw{flex:1;overflow:auto;min-height:0;position:relative}
table.g{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11.5px}
.g thead th{position:sticky;top:0;z-index:3;background:var(--p1);height:30px;text-align:left;
  font-weight:500;padding:0 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--soft);
  white-space:nowrap;overflow:hidden;cursor:default}
.g thead th:last-child{border-right:0}
.g thead th:hover{background:var(--p2)}
.g thead .hn{display:flex;align-items:center;gap:4px;min-width:0;height:16px}
.g thead .nn{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--fg2)}
.g thead .tt{flex:none;font-family:var(--mono);font-size:9px;color:var(--fg4)}
.g thead th.thr .hn{justify-content:flex-end}
.g thead .pk{color:var(--fg3)}
.g tbody td{height:28px;padding:0 8px;border-bottom:1px solid var(--soft);border-right:1px solid var(--soft);
  color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums;position:relative}
.g tbody td:last-child{border-right:0}
.g tbody tr:hover td{background:var(--p1)}
.g tbody tr[aria-selected="true"] td{background:var(--p2)}
.g tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 2px 0 0 var(--fg)}
.g td.k{color:var(--fg);font-weight:500}
.g td.mo{font-family:var(--mono);font-size:11px}
.g td.nu{color:var(--fg4);font-style:italic}
.g td.r{text-align:right}
.g td.edited{background:var(--p2);box-shadow:inset 2px 0 0 var(--warn)}
.g td .cellin{position:absolute;inset:0;border:0;outline:0;padding:0 8px;background:var(--bg);
  font:inherit;font-family:var(--mono);font-size:11px;color:var(--fg);
  box-shadow:inset 0 0 0 1.5px var(--fg)}

/* 汇总行 */
.g tfoot td{position:sticky;bottom:0;background:var(--p1);border-top:1px solid var(--line);
  height:26px;padding:0 8px;font-family:var(--mono);font-size:10px;color:var(--fg4);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}

/* 语法高亮 */
.hlk{color:#6D28D9;font-weight:500}
.hls{color:#0F766E}
.hlc{color:var(--fg4);font-style:italic}
html.dark .hlk{color:#C084FC}
html.dark .hls{color:#5EEAD4}

/* ── v3 逻辑件 ── */
.g thead .sarr{flex:none;color:var(--fg3);font-size:8px;line-height:1;font-family:var(--mono)}
.g tbody tr.pend td{color:var(--fg4)}
.g tbody tr.pend td:first-child{box-shadow:inset 2px 0 0 var(--dgr)}
.g tbody tr.pend .cv{text-decoration:line-through;text-decoration-color:var(--fg4)}
.chip{display:inline-flex;align-items:center;height:15px;padding:0 5px;border-radius:3px;
  font-size:9px;letter-spacing:.02em;border:1px solid var(--line);background:var(--bg);color:var(--fg3)}
.chip.on{color:var(--fg2);border-color:var(--line2)}
.dlg{position:fixed;z-index:130;left:50%;top:34vh;transform:translate(-50%,-50%);width:380px;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);overflow:hidden}
.dlg .dh{padding:13px 15px 4px;font-size:12.5px;font-weight:600}
.dlg .dd{padding:0 15px 12px;font-size:11px;color:var(--fg3);line-height:1.7}
.dlg .df{padding:9px 12px;border-top:1px solid var(--line);background:var(--p1);
  display:flex;justify-content:flex-end;gap:6px}

/* ── 结构面板 292 ── */
.insp{width:292px;flex:none;border-left:1px solid var(--line);background:var(--p1);
  display:flex;flex-direction:column;min-height:0}
.insp.hide{display:none}
.ih{flex:none;padding:10px 10px 9px;border-bottom:1px solid var(--line)}
.irow{display:flex;align-items:center;gap:8px}
.imk{width:28px;height:28px;border-radius:6px;flex:none;display:flex;align-items:center;
  justify-content:center;background:var(--p2);color:var(--fg2);border:1px solid var(--line)}
.inm{font-size:12.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;font-family:var(--mono)}
.isb{font-size:10.5px;color:var(--fg4);line-height:1.4;margin-top:1px}
.ix{margin-left:auto;width:20px;height:20px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;color:var(--fg4)}
.ix:hover{background:var(--hov);color:var(--fg)}
.itags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:3px;height:17px;padding:0 5px;border-radius:3px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg3);
  font-size:9.5px;letter-spacing:.02em;white-space:nowrap}
.tg.s{background:var(--p2);border-color:var(--line2);color:var(--fg2)}
.itabs{flex:none;display:flex;border-bottom:1px solid var(--line);background:var(--p1);padding:0 6px}
.itab{height:28px;display:flex;align-items:center;padding:0 8px;font-size:11px;color:var(--fg3);
  position:relative}
.itab:hover{color:var(--fg2)}
.itab[aria-selected="true"]{color:var(--fg);font-weight:500}
.itab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;
  height:1.5px;background:var(--fg)}
.ibd{flex:1;overflow:auto;min-height:0}
.sec{padding:9px 10px 10px;border-bottom:1px solid var(--soft)}
.sec:last-child{border-bottom:0}
.st{font-size:9.5px;font-weight:600;color:var(--fg4);letter-spacing:.05em;margin-bottom:6px}
.kv{display:flex;align-items:center;gap:8px;height:23px;font-size:11px}
.kv .k{width:92px;flex:none;color:var(--fg3);font-family:var(--mono);font-size:10.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .v{flex:1;min-width:0;color:var(--fg);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.kv .v.m{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--fg2)}
.if{flex:none;padding:7px 8px;border-top:1px solid var(--line);display:flex;gap:5px;background:var(--p1)}
.if .btn{flex:1}

/* 终端抽屉 */
.term{flex:none;height:180px;border-top:1px solid var(--line);background:#0C0C0E;
  display:flex;flex-direction:column;min-height:0}
.term-h{height:26px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;
  border-bottom:1px solid #1F1F23;color:#8A8A94;font-size:10px}
.term-b{flex:1;overflow:auto;padding:6px 10px;font-family:var(--mono);font-size:11px;
  line-height:18px;color:#C8C8D0;white-space:pre}
.term-b .p{color:#4EC9B0}
.term-b .d{color:#6A6A74}

/* 状态栏 24 */
.stb{height:24px;flex:none;display:flex;align-items:center;gap:12px;padding:0 9px;
  border-top:1px solid var(--line);background:var(--p1);font-size:10px;color:var(--fg4);
  font-variant-numeric:tabular-nums}
.stb b{font-weight:500;color:var(--fg2)}
.stb .r{margin-left:auto;display:flex;gap:12px;align-items:center}
.stb .tog{display:flex;align-items:center;gap:4px;cursor:default;color:var(--fg4)}
.stb .tog:hover{color:var(--fg)}
.stb .tog.on{color:var(--fg2)}

/* 浮层 */
.ovl{position:fixed;inset:0;z-index:100}
.scrim{position:fixed;inset:0;background:rgba(24,24,27,.32);z-index:90}
html.dark .scrim{background:rgba(0,0,0,.5)}
.menu{position:fixed;z-index:110;min-width:190px;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:4px;box-shadow:var(--sh)}
.menu .mi{display:flex;align-items:center;gap:7px;height:26px;padding:0 7px;border-radius:4px;
  font-size:11.5px;color:var(--fg2)}
.menu .mi:hover{background:var(--p2);color:var(--fg)}
.menu .mi .k{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--fg4)}
.menu .dv{height:1px;background:var(--soft);margin:4px 2px}
.menu .mi.x{color:#B91C1C}
.menu .mi.x:hover{background:#FEF2F2}
html.dark .menu .mi.x{color:#F87171}
html.dark .menu .mi.x:hover{background:#2A1518}

.pal{position:fixed;z-index:120;left:50%;top:14vh;transform:translateX(-50%);width:540px;
  max-height:400px;display:flex;flex-direction:column;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);overflow:hidden}
.pin{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-bottom:1px solid var(--line);
  color:var(--fg4)}
.pin input{flex:1;border:0;outline:0;background:none;font-size:12.5px;color:var(--fg)}
.pl{overflow:auto;padding:5px}
.pg{font-size:9.5px;font-weight:600;color:var(--fg4);letter-spacing:.05em;padding:6px 7px 3px}
.pi{display:flex;align-items:center;gap:7px;height:28px;padding:0 7px;border-radius:4px;
  font-size:11.5px;color:var(--fg2)}
.pi .sub{color:var(--fg4);font-size:10px}
.pi .k{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--fg4)}
.pi.act{background:var(--p2);color:var(--fg)}
.pi .ic{color:var(--fg4)}

.toasts{position:fixed;right:12px;bottom:34px;z-index:200;display:flex;flex-direction:column;
  gap:5px;align-items:flex-end}
.tst{display:flex;align-items:center;gap:7px;background:var(--fg);color:var(--bg);
  padding:7px 10px;border-radius:5px;font-size:11px;box-shadow:var(--sh);animation:tin .13s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div class="toasts" id="toasts"></div>
<script>
/* ══════════ 图标 ══════════ */

/* ══════════ 网格 ══════════ */
function viewInfo(t){
  const T=TABLES[t.table],q=(t.q||'').toLowerCase();
  let idx=T.rows.map((r,i)=>i).filter(i=>!q||T.rows[i].some(v=>String(v).toLowerCase().includes(q)));
  if(t.sort)idx.sort((a,b)=>{
    const va=T.rows[a][t.sort.ci],vb=T.rows[b][t.sort.ci];
    const r=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb),'zh');
    return t.sort.dir==='asc'?r:-r;});
  return {T,idx,full:idx.length,view:idx.slice(0,t.limit)};
}
function cellTxt(v){
  if(typeof v==='boolean')return v?'true':'false';
  if(v===''||v==='—')return'—';
  return v;
}
function tabLabel(t){
  const dup=S.tabs.some(x=>x.table===t.table&&x.id!==t.id);
  return dup?t.conn+' · '+t.table:t.table;
}
function gridHTML(){
  const t=act();
  if(!t) return `<div class="gw"><div class="empty">
    <div class="eic">${ic('table',14)}</div>
    <div class="et">没有打开的表</div>
    <div class="ed">连接和表都在左侧树上，点任意连接下的表即可打开；不同连接的标签可以同时开着。</div></div></div>`;
  const {T,idx,full,view}=viewInfo(t);
  const nE=Object.keys(t.dr).length,nD=t.del.length;
  return `<div class="gw"><table class="g">
    <colgroup>${T.cols.map(c2=>`<col style="width:${c2.w}%">`).join('')}</colgroup>
    <thead><tr>${T.cols.map((c2,ci)=>{
      const sorted=t.sort&&t.sort.ci===ci;
      return `<th class="${c2.cls&&c2.cls.includes('r')?'thr':''}" data-sort="${ci}">
        <span class="hn">${c2.pk?`<span class="pk">${ic('key',9,2)}</span>`:''}
        <span class="nn">${c2.k}</span><span class="tt">${c2.t}</span>
        ${sorted?`<span class="sarr">${t.sort.dir==='asc'?'▲':'▼'}</span>`:''}</span></th>`;
    }).join('')}</tr></thead>
    <tbody>${view.length?view.map(i=>`<tr data-row="${i}"
        class="${t.del.includes(i)?'pend':''}" aria-selected="${t.sel===i}">
      ${T.cols.map((c2,ci)=>{
        const key=i+':'+ci,editing=S.editing===key;
        const v=editing?null:(key in t.dr?t.dr[key]:T.rows[i][ci]);
        let cls=(c2.cls||'')+(key in t.dr?' edited':'');
        if(typeof v==='boolean'&&!v)cls+=' nu';
        return `<td class="${cls.trim()}" data-cell="${key}">${editing
          ?`<input class="cellin" data-in="${key}" value="${esc(t.dr[key]??String(T.rows[i][ci]))}">`
          :`<span class="cv">${cellTxt(v)}</span>`}</td>`;
      }).join('')}</tr>`).join('')
    :`<tr><td colspan="${T.cols.length}" style="height:auto;border:0"><div class="empty">
        <div class="eic">${ic('search',14)}</div><div class="et">没有匹配的行</div>
        <div class="ed">试试更短的关键词，或清除筛选。</div>
        <button class="btn sm" data-act="clearq">清除筛选</button></div></td></tr>`}</tbody></table></div>
  ${full>t.limit?`<div style="height:32px;flex:none;display:flex;align-items:center;
    justify-content:center;gap:8px;border-top:1px solid var(--line);background:var(--p1)">
    <span class="meta">已显示 ${view.length} / ${full} 行筛选结果</span>
    <button class="btn sm" data-act="more">${ic('down2',10.5)}加载更多</button></div>`:''}
  ${(nE+nD)?`<div class="pending"><span class="pdt"></span>
    <span><b>${nE+nD}</b> 处未保存更改${nD?`（含 <b>${nD}</b> 行待删除）`:''} — 回车确认，Esc 取消</span>
    <div class="grow"></div>
    <button class="btn sm ghost" data-act="discard">${ic('undo',11)}放弃</button>
    <button class="btn sm pri" data-act="commit">${ic('save',11)}保存</button></div>`:''}`;
}

const KW=/\b(select|from|where|join|on|group|by|order|limit|as|and|or|interval|max|now|desc)\b/gi;
function hlSQL(s){
  let x=s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  x=x.replace(/(--[^\n]*)/g,'<span class="hlc">$1</span>');
  x=x.replace(/'([^']*)'/g,'<span class="hls">\'$1\'</span>');
  x=x.replace(KW,m=>`<span class="hlk">${m}</span>`);
  return x;
}

          <span style="font-size:10px;color:var(--fg4);font-family:var(--mono)">${cn.ver}</span>
          <span class="chip ${cn.mode==='rw'?'on':''}" style="margin-left:auto">${cn.mode==='rw'?'读写':'只读'}</span>
          ${cid===curConn?`<span style="color:var(--fg2)">${ic('check',11,2.2)}</span>`:''}</div>`}).join('')}
    </div>`;
  document.querySelectorAll('[data-pc]').forEach(el=>el.onclick=()=>{
    const cn=CONNS[el.dataset.pc];
    if(cn.st==='off'){toast(`${el.dataset.pc} 无法连接`);return}
    closeLayer();cb(el.dataset.pc)});
}
function dlg(title,desc,okLabel,cb){
  document.getElementById('layer').innerHTML=`<div class="scrim" data-closelayer></div>
    <div class="dlg"><div class="dh">${esc(title)}</div><div class="dd">${esc(desc)}</div>
    <div class="df"><button class="btn sm" data-dlgcancel>取消</button>
    <button class="btn sm pri" data-dlgok>${esc(okLabel)}</button></div></div>`;
  document.querySelector('[data-dlgcancel]').onclick=closeLayer;
  document.querySelector('[data-dlgok]').onclick=()=>{closeLayer();cb&&cb()};
}
document.addEventListener('mousedown',e=>{
  if(e.target.closest('[data-closelayer]')||e.target.classList.contains('scrim'))closeLayer();
});
/* ══════════ 命令面板 ══════════ */
let P_ITEMS=[],P_IDX=0;
function openPal(){
  document.getElementById('layer').innerHTML=`<div class="scrim" data-closelayer></div>
    <div class="pal"><div class="pin">${ic('search',13,1.9)}
      <input id="pin" placeholder="搜索表、连接或命令…" autocomplete="off"></div><div class="pl" id="pl"></div></div>`;
  P_IDX=0;palList('');
  const inp=$('#pin');inp.focus();
  inp.addEventListener('input',e=>{P_IDX=0;palList(e.target.value)});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();P_IDX=Math.min(P_IDX+1,P_ITEMS.length-1);paint()}
    else if(e.key==='ArrowUp'){e.preventDefault();P_IDX=Math.max(P_IDX-1,0);paint()}
    else if(e.key==='Enter'){e.preventDefault();const it=P_ITEMS[P_IDX];closeLayer();if(it)it.run()}});
}
function palList(q){
  const s=q.trim().toLowerCase();
  const cmds=[
    ...MODS.map(m=>({g:'前往',n:m.n,i:m.i,run:()=>{S.mod=m.id;render()}})),
    {g:'命令',n:'切换主题',i:S.theme==='dark'?'sun':'moon',run:()=>{S.theme=S.theme==='dark'?'light':'dark';render()}},
    {g:'命令',n:'切换终端抽屉',i:'term',run:()=>{S.term=S.term?null:'bastion-01';render()}},
    {g:'命令',n:'切换检视栏',i:'cols',run:()=>{S.insp=!S.insp;render()}},
    {g:'命令',n:'新建查询',i:'plus',run:()=>{S.mod='sql';render()}},
    ...Object.keys(CONNS).filter(c=>CONNS[c].st==='ok').flatMap(c=>
      CONNS[c].tables.slice(0,3).map(t=>({g:`打开表 · ${c}`,n:t,i:'table',
        run:()=>{openTab(c,t);render()}}))),
  ];
  P_ITEMS=s?cmds.filter(x=>(x.n+x.g).toLowerCase().includes(s)):cmds;
  const groups={};P_ITEMS.forEach((it,i)=>{(groups[it.g]||=[]).push({...it,_i:i})});
  document.getElementById('pl').innerHTML=Object.entries(groups).map(([g,items])=>
    `<div class="pg">${esc(g)}</div>`+items.map(it=>
      `<div class="pi ${P_IDX===it._i?'act':''}" data-pi="${it._i}"><span class="ic">${ic(it.i,12)}</span>
        <span>${esc(it.n)}</span><span class="k"></span></div>`).join('')
  ).join('')||`<div style="padding:20px;text-align:center;font-size:11px;color:var(--fg4)">没有匹配项</div>`;
  document.querySelectorAll('[data-pi]').forEach(el=>el.onclick=()=>{
    const it=P_ITEMS[+el.dataset.pi];closeLayer();it.run()});
}
function paint(){document.querySelectorAll('[data-pi]').forEach(el=>
  el.classList.toggle('act',+el.dataset.pi===P_IDX))}

/* ══════════ 编辑 ══════════ */
function startEdit(key){
  if(ro()){toast('只读连接，无法编辑');return}
  const t=act(),[ri]=key.split(':').map(Number);
  if(t.del.includes(ri)){toast('该行已标记删除');return}
  S.editing=key;render();
  const inp=document.querySelector(`[data-in="${key}"]`);
  if(inp){inp.focus();inp.select();
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();commitEdit(inp.value)}
      else if(e.key==='Escape'){S.editing=null;render()}});
    inp.addEventListener('blur',()=>{if(S.editing===key)commitEdit(inp.value)});}
}
function commitEdit(v){
  const key=S.editing;if(key==null)return;
  const t=act(),[ri,ci]=key.split(':').map(Number);
  const raw=TABLES[t.table].rows[ri][ci];
  let val=v.trim();
  if(typeof raw==='boolean')val=val.toLowerCase()==='true';
  if(String(val)!==String(raw))t.dr[key]=val;else delete t.dr[key];
  S.editing=null;render();
}
function doDelete(){
  const t=act();if(!t||ro()||t.sel==null)return;
  if(!t.del.includes(t.sel)){t.del.push(t.sel);render();toast('已标记删除，保存后生效')}
}

/* ══════════ 事件 ══════════ */
document.addEventListener('click',e=>{
  const el=e.target;
  const m=el.closest('[data-mod]');if(m){S.mod=m.dataset.mod;render();return}
  const th=el.closest('[data-theme]');if(th){S.theme=th.dataset.theme;render();return}
  const tb=el.closest('[data-tab]');
  if(tb&&!el.closest('[data-close]')){if(S.act!==tb.dataset.tab){S.act=tb.dataset.tab;S.editing=null;render()}return}
  const stb=el.closest('[data-sqltab]');if(stb){S.sa=+stb.dataset.sqltab;render();return}
  const scl=el.closest('[data-sqlclose]');
  if(scl){e.stopPropagation();
    if(S.sql.length>1){S.sql.splice(+scl.dataset.sqlclose,1);S.sa=Math.min(S.sa,S.sql.length-1);render()}
    else toast('至少保留一个查询');return}
  const cl=el.closest('[data-close]');
  if(cl){e.stopPropagation();
    const t=TAB(cl.dataset.close),n=dirty(t);
    if(n>0)dlg(`关闭 ${tabLabel(t)}？`,`该标签有 ${n} 处未保存更改，关闭将丢弃。`,'丢弃并关闭',()=>{
      S.tabs=S.tabs.filter(x=>x.id!==t.id);
      S.act=S.tabs.length?S.tabs[S.tabs.length-1].id:null;render();});
    else{S.tabs=S.tabs.filter(x=>x.id!==t.id);
      S.act=S.tabs.length?S.tabs[S.tabs.length-1].id:null;render()}
    return}
  const itab=el.closest('[data-itab]');if(itab){S.inspTab=itab.dataset.itab;render();return}
  const ex=el.closest('[data-exp]');
  if(ex){const k=ex.dataset.exp;S.open[k]=!S.open[k];render();return}
  const cn2=el.closest('[data-conn]');
  if(cn2){/* 点击连接节点：仅展开/收起，不切换全局 */return}
  const op=el.closest('[data-opentab]');
  if(op){const[conn,table]=op.dataset.opentab.split(':');openTab(conn,table);render();return}
  const th3=el.closest('[data-termhost]');if(th3){S.term=th3.dataset.termhost;render();return}
  const row=el.closest('tr[data-row]');
  if(row){const t=act();if(t){t.sel=+row.dataset.row;render()}return}
  const sc=el.closest('#sqlConn');
  if(sc){const r=sc.getBoundingClientRect();
    connMenuFor(r.left,r.bottom+4,S.sql[S.sa].conn,pc=>{S.sql[S.sa].conn=pc;render();
      toast(`本查询已切换到 ${pc}`)});return}
  const a=el.closest('[data-act]');
  if(a){const x=a.dataset.act;
    if(x==='theme'){S.theme=S.theme==='dark'?'light':'dark';render()}
    else if(x==='insp'){S.insp=!S.insp;render()}
    else if(x==='term'){S.term=S.term?null:'bastion-01';render()}
    else if(x==='refresh')toast('已刷新');
    else if(x==='newquery'){S.mod='sql';
      if(!S.sql.length)S.sql.push({n:'查询 1',conn:act()?act().conn:'db_prod'});render()}
    else if(x==='newsql'){S.sql.push({n:`查询 ${S.sql.length+1}`,conn:act()?act().conn:'db_prod'});
      S.sa=S.sql.length-1;render()}
    else if(x==='palette')openPal();
    else if(x==='newconn')toast('新建连接');
    else if(x==='cols')toast('列设置');
    else if(x==='more')toast('更多操作');
    else if(x==='run')toast(`查询完成 · ${CONNS[S.sql[S.sa].conn].lat}`);
    else if(x==='discard'){const t=act();if(t){t.dr={};t.del=[];render();toast('已放弃更改')}}
    else if(x==='commit'){const t=act(),T=TABLES[t.table];
      const delSet=new Set(t.del);let n=0;
      Object.entries(t.dr).forEach(([k,v])=>{const[ri,ci]=k.split(':').map(Number);
        if(delSet.has(ri))return;
        if(ri<T.rows.length){T.rows[ri][ci]=typeof T.rows[ri][ci]==='boolean'?(v===true||v==='true'):v;n++}});
      t.del.slice().sort((x2,y2)=>y2-x2).forEach(i=>{T.rows.splice(i,1);n++});
      t.dr={};t.del=[];render();toast(`已提交 ${n} 处更改`)}
    else if(x==='delrow')doDelete();
    else if(x==='clearq'){const t=act();if(t){t.q='';render()}}
    else if(x==='design')toast('表设计器');
    else if(x==='viewdata'){S.mod='workbench';render()}
    return}
});
document.addEventListener('dblclick',e=>{
  const td=e.target.closest('td[data-cell]');
  if(td&&S.mod==='workbench'){e.preventDefault();startEdit(td.dataset.cell)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){const t=act();if(!t)return;
    t.q=e.target.value;
    const {view}=viewInfo(t);
    if(!view.includes(t.sel))t.sel=view[0]??null;
    render();
    const p=$('#q');if(p){p.focus();p.setSelectionRange(p.value.length,p.value.length)}}
});
document.addEventListener('keydown',e=>{
  const meta=e.metaKey||e.ctrlKey;
  if(meta&&e.key.toLowerCase()==='k'){e.preventDefault();
    document.getElementById('layer').innerHTML?closeLayer():openPal();return}
  if(e.key==='Escape'){closeLayer();return}
  if(meta&&e.key==='Enter'){const b=document.querySelector('[data-act="run"]');if(b){e.preventDefault();b.click()}}
  if(!meta&&!e.target.matches('input,textarea')&&/^[1-7]$/.test(e.key)){
    const m=MODS[+e.key-1];if(m){S.mod=m.id;render()}}
});
render();
</script>
