<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DbNest — 数据库工作台</title>
<style>
:root{
  --n0:#FFFFFF; --n1:#FCFCFC; --n2:#FAFAFA; --n3:#F4F4F5; --n4:#EFEFF1;
  --n5:#E8E8E8; --n6:#E2E2E4; --n7:#C5C5C9; --n8:#A8A8B0; --n9:#8E8E96;
  --n10:#52525B; --n11:#18181B;
  --line:#E8E8E8; --soft:#F1F1F1;
  --ok:#16A34A; --warn:#D97706; --dgr:#DC2626;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Microsoft YaHei",sans-serif;
  --sh1:0 1px 2px rgba(24,24,27,.06);
  --sh2:0 8px 24px rgba(24,24,27,.10),0 2px 6px rgba(24,24,27,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);font-size:12px;line-height:1.5;color:var(--n11);background:var(--n0);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
svg{display:block;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:rgba(24,24,27,.12)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--n6);border:3px solid transparent;background-clip:content-box;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--n7);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ══════════════ 框架 ══════════════ */
.app{display:flex;flex-direction:column;height:100vh;background:var(--n0)}

/* 顶栏 50 */
.topbar{height:50px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 12px;border-bottom:1px solid var(--line);background:var(--n0);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;padding-right:2px}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--n11);
  display:flex;align-items:center;justify-content:center;color:#fff}
.brand-name{font-size:13px;font-weight:600;letter-spacing:-.012em}
.brand-sub{font-size:10px;color:var(--n8);letter-spacing:.04em;text-transform:uppercase;
  margin-left:1px;padding-top:1px}
.divider-v{width:1px;height:16px;background:var(--line);flex:none}

.conn-btn{display:flex;align-items:center;gap:7px;height:28px;padding:0 7px 0 6px;
  border-radius:5px;border:1px solid transparent;color:var(--n10);min-width:0}
.conn-btn:hover{background:var(--n3);border-color:var(--line)}
.conn-btn[aria-expanded="true"]{background:var(--n3);border-color:var(--line)}
.conn-ico{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  color:var(--n9);flex:none}
.conn-name{font-size:12px;font-weight:500;color:var(--n11);white-space:nowrap}
.conn-meta{font-size:10.5px;color:var(--n8);white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--n8);transition:transform .12s}
.conn-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.spacer{flex:1}

.searchbtn{display:flex;align-items:center;gap:6px;height:28px;width:236px;padding:0 7px 0 8px;
  border:1px solid var(--line);border-radius:5px;color:var(--n8);background:var(--n1)}
.searchbtn:hover{border-color:var(--n6);background:var(--n0)}
.searchbtn span{font-size:11.5px}
.kbd{font-family:var(--mono);font-size:10px;line-height:14px;padding:0 4px;border-radius:3px;
  border:1px solid var(--line);background:var(--n2);color:var(--n9)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 10px;
  border:1px solid var(--line);border-radius:5px;background:var(--n0);
  font-size:11.5px;font-weight:500;color:var(--n11);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--n3)}
.btn:active{background:var(--n4)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--n0),0 0 0 3.5px var(--n11)}
.btn-solid{background:var(--n11);border-color:var(--n11);color:#fff}
.btn-solid:hover{background:#000;border-color:#000}
.btn-ghost{border-color:transparent;color:var(--n10)}
.btn-ghost:hover{background:var(--n3);color:var(--n11)}
.btn-icon{width:28px;padding:0;color:var(--n10)}
.btn-sm{height:24px;padding:0 8px;font-size:11px;border-radius:4px}
.btn-sm.btn-icon{width:24px}
.btn-danger{color:#B91C1C}
.btn-danger:hover{background:#FEF2F2;border-color:#FECACA}

/* 主体 */
.body{flex:1;display:flex;min-height:0}

/* 模块栏 52 */
.rail{width:52px;flex:none;background:var(--n2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:7px 0 6px;gap:1px}
.rail-btn{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--n9);position:relative;transition:background .12s,color .12s}
.rail-btn:hover{background:var(--n4);color:var(--n11)}
.rail-btn[aria-current="page"]{background:var(--n11);color:#fff}
.rail-btn[aria-current="page"]:hover{background:var(--n11);color:#fff}
.rail-btn .tip{position:absolute;left:40px;top:50%;transform:translateY(-50%);
  background:var(--n11);color:#fff;font-size:11px;line-height:1;padding:6px 8px;border-radius:4px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s .35s;z-index:60}
.rail-btn:hover .tip{opacity:1}
.rail-sep{width:22px;height:1px;background:var(--line);margin:5px 0}

/* 上下文栏 214 */
.ctx{width:214px;flex:none;background:var(--n2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.ctx-h{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;
  border-bottom:1px solid var(--line)}
.ctx-title{font-size:10px;font-weight:600;color:var(--n8);letter-spacing:.06em;text-transform:uppercase}
.ctx-h .btn-sm.btn-icon{width:22px;height:22px;color:var(--n9)}
.ctx-body{flex:1;overflow:auto;min-height:0;padding:5px 5px 8px}
.ctx-foot{flex:none;height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;
  border-top:1px solid var(--line);font-size:10px;color:var(--n8);font-variant-numeric:tabular-nums}

.grp{display:flex;align-items:center;gap:5px;padding:9px 6px 3px;font-size:10px;
  font-weight:500;color:var(--n8);letter-spacing:.04em}
.grp .ln{flex:1;height:1px;background:var(--line)}

.tree{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px;border-radius:4px;
  color:var(--n10);cursor:default;font-size:11.5px;position:relative;user-select:none}
.tree:hover{background:var(--n4)}
.tree[aria-selected="true"]{background:var(--n0);color:var(--n11);font-weight:500;
  box-shadow:inset 0 0 0 1px var(--line),var(--sh1)}
.tree .tw{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .ic{color:var(--n8)}
.tree[aria-selected="true"] .ic{color:var(--n11)}
.tree .cnt{font-size:10px;color:var(--n8);font-variant-numeric:tabular-nums}
.tree .st{width:5px;height:5px;border-radius:50%;flex:none}
.tree .caret{width:9px;height:9px;display:flex;align-items:center;justify-content:center;
  flex:none;color:var(--n8);transition:transform .12s}
.tree .caret.ghost{opacity:0}
.tree[aria-expanded="true"] .caret{transform:rotate(90deg)}
.tree.d1{padding-left:20px}
.tree.d2{padding-left:34px}
.tree.d3{padding-left:48px}
.tree.d1::before,.tree.d2::before,.tree.d3::before{content:"";position:absolute;left:12px;top:0;bottom:0;
  width:1px;background:var(--line)}
.tree.d2::before{left:26px}
.tree.d3::before{left:40px}
.tree.d1:hover::before,.tree.d2:hover::before,.tree.d3:hover::before{background:var(--n7)}

/* 主区 */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--n0)}

/* 标签栏 32 */
.tabbar{height:32px;flex:none;display:flex;align-items:stretch;background:var(--n1);
  border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabbar::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:5px;padding:0 7px 0 9px;max-width:220px;min-width:0;
  border-right:1px solid var(--line);font-size:11px;color:var(--n9);position:relative;
  white-space:nowrap;cursor:default;background:var(--n1)}
.tab:hover{background:var(--n3);color:var(--n10)}
.tab[aria-selected="true"]{background:var(--n0);color:var(--n11);font-weight:500}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:1.5px;background:var(--n11)}
.tab .tn{overflow:hidden;text-overflow:ellipsis}
.tab .tx{width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  color:var(--n7);opacity:0;flex:none}
.tab:hover .tx,[aria-selected="true"].tab .tx{opacity:1}
.tab .tx:hover{background:var(--n4);color:var(--n11)}
.tabbar .add{width:28px;display:flex;align-items:center;justify-content:center;color:var(--n8);flex:none}
.tabbar .add:hover{background:var(--n3);color:var(--n11)}
.tab-fill{flex:1;min-width:8px}

/* 工具行 40 */
.toolbar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;
  border-bottom:1px solid var(--line);background:var(--n0)}
.field{display:flex;align-items:center;gap:6px;height:26px;padding:0 7px;border:1px solid var(--line);
  border-radius:4px;color:var(--n8);background:var(--n0);min-width:0}
.field:hover{border-color:var(--n6)}
.field:focus-within{border-color:var(--n11);box-shadow:0 0 0 3px rgba(24,24,27,.07)}
.field input{border:0;outline:0;background:none;width:100%;font-size:11.5px;color:var(--n11)}
.field input::placeholder{color:var(--n8)}
.w180{width:180px}

.seg{display:inline-flex;height:26px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{display:flex;align-items:center;gap:4px;padding:0 8px;font-size:11px;color:var(--n9);
  border-right:1px solid var(--line);background:var(--n0)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--n3);color:var(--n10)}
.seg button[aria-pressed="true"]{background:var(--n11);color:#fff}

.mono-num{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--n8)}

/* ══════════════ 数据网格 ══════════════ */
.gridwrap{flex:1;overflow:auto;min-height:0;position:relative;background:var(--n0)}
table.grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--n1);height:32px;
  text-align:left;font-weight:500;padding:0 9px;border-bottom:1px solid var(--line);
  border-right:1px solid var(--soft);white-space:nowrap;cursor:pointer;overflow:hidden}
.grid thead th:last-child{border-right:0}
.grid thead th:hover{background:var(--n3)}
.grid thead th .thn{font-size:11px;color:var(--n10);display:flex;align-items:center;gap:4px;
  min-width:0;overflow:hidden}
.grid thead th .nmx{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid thead th .ty{font-family:var(--mono);font-size:9.5px;color:var(--n8);font-weight:400;
  letter-spacing:0;flex:none}
.grid thead th.thr .thn{justify-content:flex-end}
.grid thead th.pkc .thn{color:var(--n11)}
.grid thead th .pkico{color:var(--n8)}

.grid tbody td{height:30px;padding:0 9px;border-bottom:1px solid var(--soft);
  border-right:1px solid var(--soft);font-size:11.5px;color:var(--n10);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.grid tbody td:last-child{border-right:0}
.grid tbody tr:hover td{background:var(--n2)}
.grid tbody tr[aria-selected="true"] td{background:var(--n3)}
.grid tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 2px 0 0 var(--n11)}
.grid td.nm{color:var(--n11);font-weight:500}
.grid td.mn{font-family:var(--mono);font-size:11px}
.grid td.nul{color:var(--n7);font-style:italic}
.grid td.rn{text-align:right}
.grid .rowno{background:var(--n1);color:var(--n8);font-family:var(--mono);font-size:10px;
  text-align:right;padding-right:7px;border-right:1px solid var(--line)}
.grid tbody tr:hover .rowno{background:var(--n3);color:var(--n9)}

/* 底部加载条 */
.loadbar{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-top:1px solid var(--line);background:var(--n1);font-size:10.5px;color:var(--n8)}
.loadbar b{color:var(--n10);font-weight:500;font-variant-numeric:tabular-nums}

/* ══════════════ 检视栏 322 ══════════════ */
.insp{width:322px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;background:var(--n0)}
.insp-h{flex:none;padding:11px 12px 10px;border-bottom:1px solid var(--line)}
.insp-row1{display:flex;align-items:flex-start;gap:9px}
.insp-mark{width:30px;height:30px;border-radius:6px;flex:none;display:flex;align-items:center;
  justify-content:center;background:var(--n3);color:var(--n10);border:1px solid var(--line)}
.insp-id{font-size:12.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35;
  font-family:var(--mono)}
.insp-sub{font-size:10.5px;color:var(--n8);line-height:1.4;margin-top:1px}
.insp-x{margin-left:auto;width:22px;height:22px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;color:var(--n8);flex:none}
.insp-x:hover{background:var(--n3);color:var(--n11)}
.insp-tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}

.tg{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:3px;
  border:1px solid var(--line);background:var(--n2);color:var(--n9);
  font-size:9.5px;letter-spacing:.03em;white-space:nowrap}
.tg.solid{background:var(--n4);border-color:var(--n6);color:var(--n10)}
.tg.pk{color:var(--warn);border-color:#FDE68A;background:#FFFBEB}

.insp-body{flex:1;overflow:auto;min-height:0}
.sec{padding:10px 12px 11px;border-bottom:1px solid var(--soft)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.sec-t{font-size:9.5px;font-weight:600;color:var(--n8);letter-spacing:.06em;text-transform:uppercase}
.sec-h .spacer{flex:1}

.kv{display:flex;align-items:center;gap:10px;height:24px;font-size:11px}
.kv .k{width:88px;flex:none;color:var(--n9);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:10.5px}
.kv .v{flex:1;min-width:0;color:var(--n11);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.kv .v.mn{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--n10)}

.insp-foot{flex:none;padding:8px 10px;border-top:1px solid var(--line);display:flex;gap:6px;
  background:var(--n1)}
.insp-foot .btn{flex:1}

.t-k{color:#6D28D9;font-weight:500}
.t-s{color:#0F766E}
.t-c{color:var(--n8);font-style:italic}
html.dark .t-k{color:#C084FC}
html.dark .t-s{color:#5EEAD4}

/* 状态栏 26 */
.statusbar{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 10px;
  border-top:1px solid var(--line);background:var(--n2);font-size:10px;color:var(--n8);
  font-variant-numeric:tabular-nums}
.statusbar b{font-weight:500;color:var(--n10)}
.statusbar .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);display:inline-block}
.statusbar .right{margin-left:auto;display:flex;gap:14px;align-items:center}

/* 空态 */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:40px 24px;text-align:center}
.empty .eic{width:34px;height:34px;border-radius:7px;background:var(--n2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--n8);margin-bottom:5px}
.empty .et{font-size:12.5px;font-weight:600;color:var(--n11)}
.empty .ed{font-size:11px;color:var(--n8);max-width:300px;line-height:1.6}
.empty .btn{margin-top:9px}

/* 浮层 */
.scrim{position:fixed;inset:0;z-index:100}
.menu{position:fixed;z-index:101;min-width:200px;max-width:300px;background:var(--n0);
  border:1px solid var(--line);border-radius:6px;padding:4px;box-shadow:var(--sh2)}
.menu .mi{display:flex;align-items:center;gap:7px;height:28px;padding:0 7px;border-radius:4px;
  font-size:11.5px;color:var(--n10);cursor:default}
.menu .mi:hover{background:var(--n3);color:var(--n11)}
.menu .mi .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--n8)}
.menu .mi.dgr{color:#B91C1C}
.menu .mi.dgr:hover{background:#FEF2F2;color:#B91C1C}
.menu .div{height:1px;background:var(--soft);margin:4px 2px}
.menu .mh{padding:5px 7px 3px;font-size:9.5px;color:var(--n8);letter-spacing:.05em;text-transform:uppercase}

.toasts{position:fixed;right:14px;bottom:38px;z-index:200;display:flex;flex-direction:column;
  gap:6px;align-items:flex-end}
.tst{display:flex;align-items:center;gap:7px;background:var(--n11);color:#fff;padding:8px 11px;
  border-radius:5px;font-size:11px;box-shadow:var(--sh2);animation:tin .14s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* 焦点可见 */
:focus-visible{outline:none}
.tree:focus-visible,.tab:focus-visible,.rail-btn:focus-visible{
  box-shadow:inset 0 0 0 1.5px var(--n11)}

/* ══════════════ 深色主题 ══════════════ */
html.dark{
  --n0:#18181B; --n1:#1B1B1F; --n2:#1E1E23; --n3:#24242A; --n4:#2A2A31;
  --n5:#303038; --n6:#3A3A43; --n7:#4E4E58; --n8:#6E6E79; --n9:#8A8A95;
  --n10:#B2B2BC; --n11:#EDEDF0;
  --line:#2B2B33; --soft:#232329;
  --ok:#22C55E; --warn:#F59E0B; --dgr:#EF4444;
  --sh1:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 10px 30px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
}
html.dark .brand-mark{background:#EDEDF0;color:#18181B}
html.dark .btn-solid{background:#EDEDF0;border-color:#EDEDF0;color:#18181B}
html.dark .btn-solid:hover{background:#fff;border-color:#fff}
html.dark .seg button[aria-pressed="true"]{background:#EDEDF0;color:#18181B}
html.dark .rail-btn[aria-current="page"]{background:#EDEDF0;color:#18181B}
html.dark .rail-btn[aria-current="page"]:hover{background:#EDEDF0;color:#18181B}
html.dark .btn-danger{color:#F87171}
html.dark .btn-danger:hover{background:#2A1518;border-color:#5A2429}
html.dark .menu .mi.dgr{color:#F87171}
html.dark .menu .mi.dgr:hover{background:#2A1518}
html.dark .tg.pk{color:#FBBF24;border-color:#4A3A12;background:#2A2210}
html.dark ::-webkit-scrollbar-thumb{background:#3A3A43;border-color:transparent;background-clip:content-box}
html.dark ::selection{background:rgba(237,237,240,.18)}

</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ══════════════════════════════════════════════════════════
   DbNest · 界面定义
   ══════════════════════════════════════════════════════════ */
const I = {
  db:'<ellipse cx="12" cy="6" rx="6.5" ry="2.6"/><path d="M5.5 6v12c0 1.44 2.9 2.6 6.5 2.6s6.5-1.16 6.5-2.6V6"/>',

function rowHTML(r,i){
  const cells=COLS.map((c,ci)=>{
    const v=r[ci];
    let cls=c.cls||'';
    let txt=v;
    if(typeof v==='boolean'){ txt=v?'true':'false'; if(!v) cls+=' nul'; }
    else if(v===null||v===''){ txt='NULL'; cls+=' nul'; }
    if(c.k==='id') cls+=' rn';
    return `<td class="${cls.trim()}">${txt}</td>`;
  }).join('');
  return `<tr data-row="${i}" aria-selected="${S.sel===i}" tabindex="0">${cells}</tr>`;
}

const KW=/\b(select|from|where|join|on|group|by|order|limit|as|and|or|interval|max|min|count|now|desc|asc)\b/gi;
function hlSQL(src){
  let s=src.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  s=s.replace(/(--[^\n]*)/g,'<span class="t-c">$1</span>');
  s=s.replace(/'([^']*)'/g,"<span class=\"t-s\">'$1'</span>");
  s=s.replace(KW,m=>`<span class="t-k">${m}</span>`);
  return s;
}

/* ══════════════ 交互 ══════════════ */
function toast(msg){
  const el=document.createElement('div');
  el.className='tst';el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .18s';el.style.opacity='0';setTimeout(()=>el.remove(),190)},2000);
}

document.addEventListener('click',e=>{
  const t=e.target;
  const mod=t.closest('[data-mod]');
  if(mod){ S.module=mod.dataset.mod; S.q=''; render(); return; }

  const th=t.closest('[data-theme]');
  if(th){ S.theme=th.dataset.theme; render(); return; }

  const tab=t.closest('[data-tab]');
  if(tab && !t.closest('[data-close]')){ S.tab=tab.dataset.tab; S.sel=0; render(); return; }

  const cl=t.closest('[data-close]');
  if(cl){ e.stopPropagation(); toast('关闭标签'); return; }

  const exp=t.closest('[data-exp]');
  if(exp){
    const k=exp.dataset.exp;
    const key=k==='生产环境'?'prod':k==='测试环境'?'test':k==='视图'?'views':k==='函数'?'fns':k;
    S.open[key]=!S.open[key]; render(); return;
  }

  const row=t.closest('[data-row]');
  if(row){ S.sel=+row.dataset.row; render(); return; }

  const view=t.closest('[data-view]');
  if(view){ S.view=view.dataset.view; render(); return; }

  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='theme'){ S.theme=S.theme==='dark'?'light':'dark'; render(); return; }
    if(a==='insp-close'){ S.inspOpen=false; render(); return; }
    if(a==='insp-toggle'){ S.inspOpen=!S.inspOpen; render(); return; }
    if(a==='clearq'){ S.q=''; render(); return; }
    if(a==='refresh'){ toast('已刷新'); return; }
    if(a==='newquery'){ S.module='sql'; render(); return; }
    if(a==='newtab'){ S.module='sql'; render(); return; }
    if(a==='palette'){ toast('打开命令面板'); return; }
    if(a==='newconn'){ toast('新建连接'); return; }
    if(a==='cols'){ toast('列设置'); return; }
    if(a==='more'){ toast('更多操作'); return; }
    if(a==='save'){ toast('已保存'); return; }
    if(a==='del'){ toast('需要确认'); return; }
    if(a==='run'){ toast('查询完成 · 24 ms'); return; }
    return;
  }
});

document.addEventListener('input',e=>{
  if(e.target.id==='q'){ S.q=e.target.value; render();
    const p=document.getElementById('q'); if(p){p.focus();p.setSelectionRange(p.value.length,p.value.length);} }
});

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); toast('打开命令面板'); }
});

render();
</script>
