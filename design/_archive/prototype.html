<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DbNest 交互原型</title>
<style>
:root{
  --n0:#FFFFFF; --n1:#FCFCFC; --n2:#FAFAFA; --n3:#F4F4F5; --n4:#EFEFF1;
  --n5:#E8E8E8; --n6:#E2E2E4; --n7:#C5C5C9; --n8:#A8A8B0; --n9:#8E8E96;
  --n10:#52525B; --n11:#18181B;
  --line:var(--n5); --soft:#F1F1F1;
  --ok:#16A34A; --okt:#15803D; --warn:#D97706; --dgr:#DC2626; --dgrt:#B91C1C;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Microsoft YaHei",sans-serif;
}
html.dark{
  --n0:#18181B; --n1:#1C1C20; --n2:#202024; --n3:#26262B; --n4:#2C2C32;
  --n5:#33333A; --n6:#3D3D45; --n7:#5A5A64; --n8:#71717A; --n9:#8E8E96;
  --n10:#B4B4BC; --n11:#EDEDF0;
  --soft:#232328;
  --ok:#22C55E; --okt:#4ADE80; --warn:#F59E0B; --dgr:#EF4444; --dgrt:#F87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:12px;color:var(--n11);background:var(--n0);
  -webkit-font-smoothing:antialiased;overflow:hidden}
svg{display:block;flex:none}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--n6);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--n7);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100vh}

/* ---------- 顶栏 ---------- */
.topbar{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;
  border-bottom:1px solid var(--line);background:var(--n0)}
.brand{display:flex;align-items:center;gap:8px}
.brand-mark{width:23px;height:23px;border-radius:5px;background:var(--n11);
  display:flex;align-items:center;justify-content:center}
.brand-mark svg{stroke:var(--n0)}
.brand-name{font-size:13px;font-weight:600;letter-spacing:-.01em}
.vline{width:1px;height:15px;background:var(--line)}
.conn{display:flex;align-items:center;gap:7px;height:27px;padding:0 8px;border-radius:5px;cursor:pointer}
.conn:hover{background:var(--n3)}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.conn-name{font-size:12px;font-weight:500}
.conn-meta{font-size:11px;color:var(--n8);font-variant-numeric:tabular-nums}
.grow{flex:1}

.search{display:flex;align-items:center;gap:6px;height:28px;width:210px;padding:0 8px;
  border:1px solid var(--line);border-radius:5px;color:var(--n8);cursor:pointer}
.search:hover{border-color:var(--n6)}
.search span{font-size:11px;color:var(--n8)}
.kbd{font-size:10px;color:var(--n8);border:1px solid var(--line);border-radius:3px;
  padding:0 3px;line-height:1.5;font-family:var(--mono)}

.btn{display:inline-flex;align-items:center;gap:5px;height:29px;padding:0 10px;
  border:1px solid var(--line);border-radius:5px;background:var(--n0);
  font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--n3)}
.btn:active{background:var(--n4)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--n0),0 0 0 3.5px var(--n11)}
.btn-solid{background:var(--n11);border-color:var(--n11);color:var(--n0)}
.btn-solid:hover{opacity:.86;background:var(--n11)}
.btn-solid:active{opacity:.94}
.btn-icon{width:29px;padding:0;justify-content:center;color:var(--n10)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--n10)}
.btn-ghost:hover{background:var(--n3);color:var(--n11)}
.btn-danger{color:var(--dgrt)}
.btn-danger:hover{background:#FEF2F2;border-color:#FECACA}
html.dark .btn-danger:hover{background:#2A1414;border-color:#5A2020}
.btn-sm{height:24px;padding:0 8px;font-size:11px;border-radius:4px}
.btn[disabled]{background:var(--n2);border-color:var(--soft);color:var(--n7);cursor:not-allowed}

/* ---------- 四栏 ---------- */
.cols{flex:1;display:flex;min-height:0}

/* 图标栏 44 */
.rail{width:44px;flex:none;background:var(--n2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
.rail-btn{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  color:var(--n9);cursor:pointer;position:relative;border:0;background:none}
.rail-btn:hover{background:var(--n4);color:var(--n11)}
.rail-btn.on{background:var(--n11);color:var(--n0)}
.rail-btn.on:hover{background:var(--n11);color:var(--n0)}
.rail-btn::after{content:"";position:absolute;left:38px;top:50%;transform:translateY(-50%);
  background:var(--n11);color:var(--n0);font-size:11px;padding:3px 7px;border-radius:4px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60}
.rail-btn:hover::after{content:attr(data-t);opacity:1}
.rail-sep{width:20px;height:1px;background:var(--line);margin:4px 0}

/* 上下文面板 214 */
.ctx{width:214px;flex:none;background:var(--n2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.ctx-h{height:38px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;
  border-bottom:1px solid var(--line)}
.ctx-title{font-size:11px;font-weight:500;color:var(--n9);letter-spacing:.03em}
.ctx-body{flex:1;overflow:auto;padding:6px 6px 10px}
.ctx-foot{flex:none;padding:7px 12px;border-top:1px solid var(--line);
  font-size:10px;color:var(--n8);display:flex;align-items:center;gap:5px;
  font-variant-numeric:tabular-nums}

.grp-h{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px;
  font-size:10px;font-weight:500;color:var(--n8);letter-spacing:.03em}
.grp-h button{border:0;background:none;color:var(--n8);cursor:pointer;padding:2px;border-radius:3px;
  display:flex;align-items:center}
.grp-h button:hover{background:var(--n4);color:var(--n10)}

.tree{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border-radius:5px;
  color:var(--n10);cursor:pointer;font-size:12px;user-select:none}
.tree:hover{background:var(--n4)}
.tree.on{background:var(--n0);color:var(--n11);font-weight:500;
  box-shadow:inset 0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}
.tree svg{color:var(--n9)}
.tree.on svg{color:var(--n11)}
.tree.ind{padding-left:26px}
.tree.ind2{padding-left:40px}
.tree .tag{margin-left:auto;font-size:10px;color:var(--n8);font-variant-numeric:tabular-nums}
.tree .cdot{width:5px;height:5px;border-radius:50%;margin-left:auto;flex:none}
.tree .chev{transition:transform .12s;color:var(--n8)}
.tree.open .chev{transform:rotate(90deg)}

/* 中栏 */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--n0)}
.pane-h{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--line)}
.pane-title{font-size:13px;font-weight:600;letter-spacing:-.01em}
.pane-sub{font-size:11px;color:var(--n8);font-variant-numeric:tabular-nums}

.toolbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--line)}
.field{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;
  border:1px solid var(--line);border-radius:5px;color:var(--n8);background:var(--n0)}
.field:focus-within{border-color:var(--n11);box-shadow:0 0 0 3px rgba(24,24,27,.08)}
html.dark .field:focus-within{box-shadow:0 0 0 3px rgba(237,237,240,.08)}
.field input{border:0;outline:0;background:none;font:inherit;font-size:12px;color:var(--n11);width:100%}
.field input::placeholder{color:var(--n8)}
.field.w220{width:220px}
.field.w160{width:160px}

.seg{display:inline-flex;width:auto;border:1px solid var(--line);border-radius:5px;overflow:hidden;height:28px}
.seg span{display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--n9);
  cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg span:last-child{border-right:0}
.seg span:hover{background:var(--n3)}
.seg span.on{background:var(--n11);color:var(--n0)}

/* 标签栏 */
.tabbar{height:34px;flex:none;display:flex;align-items:stretch;border-bottom:1px solid var(--line);
  background:var(--n1);overflow-x:auto;overflow-y:hidden}
.tabbar::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;min-width:0;
  border-right:1px solid var(--line);font-size:11px;color:var(--n9);cursor:pointer;
  position:relative;white-space:nowrap;background:var(--n1)}
.tab:hover{background:var(--n3);color:var(--n10)}
.tab.on{background:var(--n0);color:var(--n11);font-weight:500}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--n11)}
.tab .x{width:14px;height:14px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  color:var(--n8);opacity:0}
.tab:hover .x,.tab.on .x{opacity:1}
.tab .x:hover{background:var(--n4);color:var(--n11)}
.tab.dirty .x{opacity:1}
.tab.dirty .x svg{display:none}
.tab.dirty .x::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--n11)}

/* 表格 */
.tw{flex:1;overflow:auto;min-height:0}
table.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl thead th{position:sticky;top:0;z-index:2;background:var(--n1);height:32px;
  text-align:left;font-size:10px;font-weight:500;color:var(--n9);letter-spacing:.03em;
  padding:0 12px;border-bottom:1px solid var(--line)}
.tbl thead th.srt{cursor:pointer;user-select:none}
.tbl thead th.srt:hover{color:var(--n11)}
.tbl tbody td{height:36px;padding:0 12px;border-bottom:1px solid var(--soft);
  font-size:12px;color:var(--n10);vertical-align:middle;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tbl tbody tr{cursor:default}
.tbl tbody tr:hover td{background:var(--n3)}
.tbl tbody tr.sel td{background:var(--n3)}
.tbl tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--n11)}
.tbl td.pry{color:var(--n11);font-weight:500}
.tbl td.num{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.tbl td.null{color:var(--n8);font-style:italic}

/* Inspector */
.insp{width:322px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;background:var(--n0)}
.insp.hide{display:none}
.insp-h{flex:none;padding:12px 14px;border-bottom:1px solid var(--line)}
.insp-top{display:flex;align-items:flex-start;gap:10px}
.obj-mark{width:34px;height:34px;border-radius:8px;flex:none;display:flex;align-items:center;
  justify-content:center;background:var(--n4);color:var(--n10);border:1px solid var(--line)}
.obj-name{font-size:13px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.obj-sub{font-size:11px;color:var(--n8);margin-top:1px;line-height:1.35}
.xbtn{margin-left:auto;width:24px;height:24px;border:0;background:none;border-radius:4px;
  color:var(--n8);cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:hover{background:var(--n3);color:var(--n11)}
.insp-tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.insp-body{flex:1;overflow:auto;min-height:0}
.sec{padding:11px 14px;border-bottom:1px solid var(--soft)}
.sec:last-child{border-bottom:0}
.sec-t{font-size:10px;font-weight:500;color:var(--n8);letter-spacing:.03em;margin-bottom:7px}
.kv{display:flex;align-items:center;justify-content:space-between;height:25px;font-size:11px}
.kv .k{color:var(--n9)}
.kv .v{color:var(--n11);font-weight:500;font-variant-numeric:tabular-nums}
.kv .v.mono{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--n10)}
.insp-foot{flex:none;padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:6px;
  background:var(--n1)}
.insp-foot .btn{flex:1;justify-content:center}

/* 通用小件 */
.tg{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:4px;
  border:1px solid var(--line);background:var(--n2);color:var(--n9);font-size:10px;letter-spacing:.03em}
.tg.solid{background:var(--n4);border-color:var(--n6);color:var(--n10)}
.tg.dgr{color:var(--dgrt);border-color:#FECACA;background:#FEF2F2}
html.dark .tg.dgr{background:#2A1414;border-color:#5A2020}
.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.off{background:var(--n7)} .dot.warn{background:var(--warn)}
.dot.dgr{background:var(--dgr)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--n10)}

.sw{width:28px;height:16px;border-radius:9px;background:var(--n6);position:relative;
  cursor:pointer;flex:none;transition:background .12s;border:0}
.sw::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;
  background:var(--n0);box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .12s}
.sw.on{background:var(--n11)}
.sw.on::after{transform:translateX(12px)}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:40px 24px;text-align:center}
.empty .ic{width:36px;height:36px;border-radius:8px;background:var(--n2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--n8);margin-bottom:4px}
.empty .t{font-size:13px;font-weight:600}
.empty .d{font-size:11px;color:var(--n8);max-width:320px;line-height:1.6}
.empty .btn{margin-top:8px}

/* 状态栏 */
.status{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;
  border-top:1px solid var(--line);background:var(--n2);font-size:10px;color:var(--n8);
  font-variant-numeric:tabular-nums}
.status b{font-weight:500;color:var(--n10)}
.status .sp{margin-left:auto}

/* 浮层 */
.ov{position:fixed;inset:0;background:rgba(24,24,27,.28);z-index:100;
  display:flex;justify-content:center;align-items:flex-start;padding-top:15vh}
.ov.center{align-items:center;padding-top:0}
html.dark .ov{background:rgba(0,0,0,.45)}
.palette{width:560px;max-height:420px;background:var(--n0);border:1px solid var(--line);
  border-radius:10px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08)}
.pal-in{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;
  border-bottom:1px solid var(--line);color:var(--n8)}
.pal-in input{border:0;outline:0;background:none;font:inherit;font-size:13px;color:var(--n11);width:100%}
.pal-list{overflow:auto;padding:6px}
.pal-g{font-size:10px;color:var(--n8);letter-spacing:.03em;padding:6px 8px 4px}
.pal-i{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:5px;
  font-size:12px;color:var(--n10);cursor:pointer}
.pal-i:hover,.pal-i.act{background:var(--n3);color:var(--n11)}
.pal-i .k{margin-left:auto;font-size:10px;color:var(--n8);font-family:var(--mono)}

.dlg{width:480px;background:var(--n0);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.18);overflow:hidden}
.dlg-h{padding:14px 16px 10px;font-size:16px;font-weight:600;letter-spacing:-.015em}
.dlg-d{padding:0 16px 4px;font-size:11px;color:var(--n8);line-height:1.6}
.dlg-b{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.dlg-f{padding:10px 16px 14px;display:flex;justify-content:flex-end;gap:6px}
.lbl{font-size:11px;color:var(--n9);margin-bottom:4px;display:block}
.inp{width:100%;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:5px;
  background:var(--n0);font:inherit;font-size:12px;color:var(--n11);outline:none}
.inp:focus{border-color:var(--n11);box-shadow:0 0 0 3px rgba(24,24,27,.08)}
html.dark .inp:focus{box-shadow:0 0 0 3px rgba(237,237,240,.08)}

.toast{position:fixed;right:16px;bottom:44px;z-index:200;display:flex;flex-direction:column;gap:6px;
  align-items:flex-end}
.tst{display:flex;align-items:center;gap:8px;background:var(--n11);color:var(--n0);
  padding:9px 12px;border-radius:6px;font-size:11.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.22);animation:tin .16s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 编辑器 */
.editor{flex:1;display:flex;flex-direction:column;min-height:0}
.code{flex:1;position:relative;overflow:auto;min-height:0;background:var(--n0)}
.code textarea{width:100%;height:100%;border:0;outline:0;resize:none;background:none;
  font-family:var(--mono);font-size:12px;line-height:20px;padding:10px 12px;color:var(--n11);
  tab-size:2}
.split{height:1px;background:var(--line);flex:none;position:relative}
.gutter{height:8px;flex:none;background:var(--n2);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);cursor:row-resize;display:flex;align-items:center;
  justify-content:center}
.gutter::before{content:"";width:24px;height:2px;border-radius:1px;background:var(--n7)}

/* 进度 */
.bar{height:4px;border-radius:2px;background:var(--n4);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--n10);border-radius:2px}
</style>
</head>
<body>
<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <ellipse cx="12" cy="5.5" rx="7" ry="3"/><path d="M5 5.5v13c0 1.7 3.1 3 7 3s7-1.3 7-3v-13"/>
        </svg>
      </div>
      <span class="brand-name">DbNest</span>
    </div>
    <div class="vline"></div>
    <div class="conn" id="connSwitch">
      <span class="conn-dot" id="connDot"></span>
      <span class="conn-name" id="connName">db_prod</span>
      <span class="conn-meta" id="connMeta">PostgreSQL 16.2</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--n8)" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="grow"></div>
    <div class="search" id="openPalette">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>搜索或执行命令</span>
      <div class="grow"></div>
      <span class="kbd">⌘K</span>
    </div>
    <button class="btn" id="themeBtn" title="切换主题">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn btn-solid" id="newConnBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建连接
    </button>
  </header>

  <div class="cols">

    <!-- 图标栏 -->
    <nav class="rail" id="rail"></nav>

    <!-- 上下文面板 -->
    <aside class="ctx">
      <div class="ctx-h">
        <span class="ctx-title" id="ctxTitle">连接</span>
        <div class="grow"></div>
        <button class="btn btn-ghost btn-sm" id="ctxAdd" title="新建">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

/* ---------- SQL 编辑器 ---------- */
const SQL_TEXT = `-- 统计近 30 天每个角色的活跃用户数
SELECT u.role,
       COUNT(DISTINCT s.user_id) AS active_users,
       COUNT(*)                  AS sessions
FROM   users u
JOIN   sessions s ON s.user_id = u.id
WHERE  s.created_at >= now() - interval '30 days'
GROUP  BY u.role
ORDER  BY active_users DESC;`;

];

/* ============================================================
   渲染入口
   ============================================================ */
function render(){
  document.documentElement.classList.toggle('dark', STATE.theme==='dark');
  renderRail();
  renderCtx();
  renderMain();
  renderInsp();
}

/* ============================================================
   命令面板
   ============================================================ */
const CMDS = [
  ...MODULES.map(m=>({g:'前往', label:m.name, icon:m.icon, run:()=>goto(m.id), k:'G'})),
  {g:'动作', label:'新建连接', icon:'plus', run:()=>openNewConn(), k:'N'},
  {g:'动作', label:'切换主题', icon:'settings', run:()=>toggleTheme(), k:'T'},
  {g:'动作', label:'切换 Inspector', icon:'layers', run:()=>{STATE.inspOpen=!STATE.inspOpen;render();}},
  {g:'动作', label:'新建查询', icon:'sql', run:()=>{goto('sql');toast('已新建查询');}},
  {g:'动作', label:'刷新当前视图', icon:'refresh', run:()=>{render();toast('已刷新');}},
];

let palIdx = 0, palItems = [];

function openPalette(){
  $('#overlays').innerHTML = `
    <div class="ov" id="palOv">
      <div class="palette">
        <div class="pal-in">
          ${ic('search',14,2)}
          <input id="palInput" placeholder="搜索表、连接或命令…" autocomplete="off">
          <span class="kbd">Esc</span>
        </div>
        <div class="pal-list" id="palList"></div>
      </div>
    </div>`;
  palIdx = 0;
  renderPalList('');
  const inp = $('#palInput');
  inp.focus();
  inp.addEventListener('input', e=>{ palIdx=0; renderPalList(e.target.value); });
  inp.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); palIdx=Math.min(palIdx+1, palItems.length-1); paintPal(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); palIdx=Math.max(palIdx-1,0); paintPal(); }
    else if(e.key==='Enter'){ e.preventDefault(); const it=palItems[palIdx]; if(it){ closePalette(); it.run(); } }
  });
  $('#palOv').addEventListener('mousedown', e=>{ if(e.target.id==='palOv') closePalette(); });
}
function closePalette(){ $('#overlays').innerHTML=''; }

function renderPalList(q){
  const s = q.trim().toLowerCase();
  const tableCmds = [];
  CONNS.forEach(c=>c.items.forEach(it=>{
    if(it.tables) it.tables.forEach(t=>tableCmds.push({
      g:'打开表', label:`${t}`, sub:it.name, icon:'table',
      run:()=>{ goto('workbench'); openTable(t); }
    }));
  }));
  const all = [...CMDS, ...tableCmds];
  palItems = s ? all.filter(i=>(i.label+i.g).toLowerCase().includes(s)) : all;
  const groups = {};
  palItems.forEach((it,i)=>{ (groups[it.g] ||= []).push({...it, _i:i}); });
  $('#palList').innerHTML = Object.entries(groups).map(([g,items])=>`
    <div class="pal-g">${g}</div>
    ${items.map(it=>`<div class="pal-i ${palIdx===it._i?'act':''}" data-pi="${it._i}">
      ${ic(it.icon,13)}<span>${esc(it.label)}</span>
      ${it.sub?`<span style="color:var(--n8);font-size:10px">${esc(it.sub)}</span>`:''}
      <span class="k"></span></div>`).join('')}`).join('')
    || `<div style="padding:24px;text-align:center;font-size:11px;color:var(--n8)">没有匹配项</div>`;

  $('#palList').querySelectorAll('[data-pi]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const it = palItems[+el.dataset.pi];
      closePalette(); it.run();
    });
  });
}
function paintPal(){
  $('#palList').querySelectorAll('[data-pi]').forEach(el=>{
    el.classList.toggle('act', +el.dataset.pi===palIdx);
  });
}

/* ============================================================
   对话框
   ============================================================ */
function closeDlg(){ $('#overlays').innerHTML=''; }

function openNewConn(){
  $('#overlays').innerHTML = `
    <div class="ov center" id="dlgOv">
      <div class="dlg">
        <div class="dlg-h">新建连接</div>
        <div class="dlg-d">连接信息保存在本地，密码经系统密钥库加密。</div>
        <div class="dlg-b">
          <div><label class="lbl">连接名称</label><input class="inp" placeholder="如：生产库" value=""></div>
          <div style="display:flex;gap:8px">
            <div style="flex:2"><label class="lbl">主机</label><input class="inp" placeholder="127.0.0.1"></div>
            <div style="flex:1"><label class="lbl">端口</label><input class="inp" placeholder="5432"></div>
          </div>
          <div><label class="lbl">类型</label>
            <div class="seg" style="height:32px">
              <span class="on" style="flex:1;justify-content:center">PostgreSQL</span>
              <span style="flex:1;justify-content:center">MySQL</span>
              <span style="flex:1;justify-content:center">Oracle</span>
              <span style="flex:1;justify-content:center">Redis</span>
            </div>
          </div>
        </div>
        <div class="dlg-f">
          <button class="btn" data-dlg="cancel">取消</button>
          <button class="btn btn-solid" data-dlg="ok">测试并保存</button>
        </div>
      </div>
    </div>`;
  $('#dlgOv').addEventListener('mousedown', e=>{ if(e.target.id==='dlgOv') closeDlg(); });
  $('#dlgOv').querySelector('[data-dlg="cancel"]').onclick = closeDlg;
  $('#dlgOv').querySelector('[data-dlg="ok"]').onclick = ()=>{ closeDlg(); toast('连接已保存'); };
}

function confirmDanger(title, desc, onOk){
  $('#overlays').innerHTML = `
    <div class="ov center" id="dlgOv">
      <div class="dlg" style="width:420px">
        <div class="dlg-h">${esc(title)}</div>
        <div class="dlg-d">${esc(desc)}</div>
        <div class="dlg-f">
          <button class="btn" data-dlg="cancel">取消</button>
          <button class="btn btn-solid" data-dlg="ok" style="background:var(--dgr);border-color:var(--dgr)">确认执行</button>
        </div>
      </div>
    </div>`;
  $('#dlgOv').addEventListener('mousedown', e=>{ if(e.target.id==='dlgOv') closeDlg(); });
  $('#dlgOv').querySelector('[data-dlg="cancel"]').onclick = closeDlg;
  $('#dlgOv').querySelector('[data-dlg="ok"]').onclick = ()=>{ closeDlg(); onOk&&onOk(); };
}

/* ============================================================
   行为
   ============================================================ */
function goto(id){
  STATE.module = id;
  STATE.ctxFilter = '';
  render();
}

function openTable(name){
  if(!STATE.openTabs.some(t=>t.id===name)){
    STATE.openTabs.push({id:name, name, kind:'table', dirty:false});
  }
  STATE.activeTab = name;
  STATE.selRow = 0;
  render();
}

function toggleTheme(){
  STATE.theme = STATE.theme==='dark' ? 'light':'dark';
  render();
  toast(STATE.theme==='dark'?'已切换到深色':'已切换到浅色');
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click', (e)=>{
  const t = e.target;

  const modBtn = t.closest('[data-mod]');
  if(modBtn){ goto(modBtn.dataset.mod); return; }

  const themeBtn2 = t.closest('[data-theme]');
  if(themeBtn2){ STATE.theme = themeBtn2.dataset.theme; render(); return; }

  const tg = t.closest('[data-toggle]');
  if(tg){
    const id = tg.dataset.toggle;
    STATE.treeOpen[id] = !STATE.treeOpen[id];
    renderCtx(); return;
  }

  const dbEl = t.closest('[data-db]');
  if(dbEl){
    const id = dbEl.dataset.db;
    STATE.treeOpen[id] = STATE.treeOpen[id]===false;
    renderCtx(); return;
  }

  const closeEl = t.closest('[data-close]');
  if(closeEl){
    e.stopPropagation();
    const id = closeEl.dataset.close;
    STATE.openTabs = STATE.openTabs.filter(x=>x.id!==id);
    if(STATE.activeTab===id) STATE.activeTab = STATE.openTabs.at(-1)?.id || null;
    render(); return;
  }

  const tabEl = t.closest('[data-tab]');
  if(tabEl){
    STATE.activeTab = tabEl.dataset.tab;
    STATE.selRow = 0;
    render(); return;
  }

  const openTbl = t.closest('[data-open-table]');
  if(openTbl){ openTable(openTbl.dataset.openTable); return; }

  const row = t.closest('tr[data-row]');
  if(row){ STATE.selRow = +row.dataset.row; render(); return; }

  const rkey = t.closest('[data-rkey]');
  if(rkey){ STATE.redisSel = +rkey.dataset.rkey; render(); return; }

  const ncfg = t.closest('[data-ncfg]');
  if(ncfg){ STATE.nacosSel = +ncfg.dataset.ncfg; render(); return; }

  const ntab = t.closest('[data-ntab]');
  if(ntab){ STATE.nacosTab = ntab.dataset.ntab; render(); return; }

  const diff = t.closest('[data-diff]');
  if(diff){ STATE.diffSel = +diff.dataset.diff; render(); return; }

  const job = t.closest('[data-job]');
  if(job){ STATE.jobSel = +job.dataset.job; render(); return; }

  const ai = t.closest('[data-ai]');
  if(ai){ STATE.aiSel = +ai.dataset.ai; render(); return; }

  const rdb = t.closest('[data-rdb]');
  if(rdb){ toast(`已切换到 db${rdb.dataset.rdb}`); return; }

  const perm = t.closest('[data-perm]');
  if(perm){
    const u = USERS[STATE.selRow];
    const p = perm.dataset.perm;
    u.perms = u.perms.includes(p) ? u.perms.filter(x=>x!==p) : [...u.perms, p];
    renderInsp(); status(`已修改 ${u.name} 的「${p}」权限`); return;
  }

  const act = t.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a==='refresh'){ render(); toast('已刷新'); }
    else if(a==='insp'){ STATE.inspOpen=!STATE.inspOpen; render(); }
    else if(a==='insp-close'){ STATE.inspOpen=false; render(); }
    else if(a==='run'){ status('执行中…'); setTimeout(()=>{ status('就绪'); toast('查询完成 · 24ms'); }, 500); }
    else if(a==='format'){ toast('已格式化 SQL'); }
    else if(a==='explain'){ toast('执行计划已生成'); }
    else if(a==='export'){ toast('已导出 5 行 CSV'); }
    else if(a==='save'){ toast('已保存'); }
    else if(a==='del-user'){ confirmDanger('停用该账户？','停用后该账户无法登录，但数据与权限配置会保留，可随时恢复。',()=>toast('账户已停用')); }
    else if(a==='copy'||a==='copy-sql'){ toast('已复制到剪贴板'); }
    else if(a==='edit'){ toast('已进入编辑模式'); }
    else if(a==='newtab'){ goto('sql'); }
    else if(a==='apply-diff'){ confirmDanger('应用 5 处变更到 db_prod？','其中 2 处为高危变更，可能锁表约 12 秒。建议在低峰期执行。',()=>toast('已加入变更队列')); }
    else if(a==='gen-sql'){ toast('已生成迁移脚本'); }
    else if(a==='new-job'||a==='nacos-new'||a==='redis-new'){ openNewConn(); }
    else if(a==='import'){ toast('已选择导入文件'); }
    else if(a==='ai-send'){ toast('任务已提交'); }
    return;
  }
});

document.addEventListener('input', (e)=>{
  const t = e.target;
  if(t.id==='redisFilter'){ STATE.redisFilter = t.value; renderMain(); return; }
  if(t.id==='tblFilter'){
    const q = t.value.toLowerCase();
    document.querySelectorAll('.tbl tbody tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  }
});

document.addEventListener('keydown', (e)=>{
  const meta = e.metaKey || e.ctrlKey;
  if(meta && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#overlays').innerHTML ? closePalette() : openPalette(); return; }
  if(e.key==='Escape'){ closePalette(); closeDlg(); return; }
  if(meta && e.key==='Enter'){ const run=document.querySelector('[data-act="run"]'); if(run){ e.preventDefault(); run.click(); } return; }

  // 模块快捷键 1-7
  if(!meta && !e.target.matches('input,textarea') && /^[1-7]$/.test(e.key)){
    const m = MODULES[+e.key-1]; if(m) goto(m.id);
  }
});

$('#openPalette').addEventListener('click', openPalette);
$('#newConnBtn').addEventListener('click', openNewConn);
$('#themeBtn').addEventListener('click', toggleTheme);
$('#ctxAdd').addEventListener('click', openNewConn);

render();
</script>
