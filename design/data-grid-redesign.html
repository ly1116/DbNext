<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数据浏览 · 重构设计稿（朴素版）</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --panel2: #fafbfc; --hover: #f2f4f7;
    --line: #e9edf2; --line2: #dfe4ec;
    --fg: #18202e; --fg2: #47536a; --dim: #7c8698; --dim2: #a3acbb;
    --accent: #3b82f6; --accent2: #2563eb; --ok: #16935f; --warn: #c2790a; --danger: #d1453b;
    --radius: 8px;
  }
  [data-theme="dark"] {
    --bg: #0f1319; --panel: #161b23; --panel2: #1a202a; --hover: #1f2733;
    --line: #232b37; --line2: #2e3846;
    --fg: #e6eaf1; --fg2: #b3bdcc; --dim: #7c8797; --dim2: #5b6575;
    --accent: #4d8dff; --accent2: #3b7bf0; --ok: #3ecf8e; --warn: #eba544; --danger: #f2635c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }

  /* ── 窗口条 ── */
  .appbar { height: 36px; background: var(--panel2); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 0 12px; user-select: none; }
  .appbar .dot { width: 10px; height: 10px; border-radius: 50%; }
  .appbar .tab { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--fg2); }
  .appbar .tab svg { width: 12px; height: 12px; }

  .page { height: calc(100vh - 36px); display: flex; flex-direction: column; }

  /* ── 表头区：表名 + 子页签 ── */
  .sheet {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    height: 38px; padding: 0 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .sheet .tbl { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
  .sheet .tbl svg { width: 14px; height: 14px; color: var(--dim2); }
  .sheet .tbl .schema { color: var(--dim); font-weight: 400; font-size: 12px; }
  .subtabs { display: flex; gap: 2px; margin-left: 12px; height: 100%; }
  .subtab {
    display: inline-flex; align-items: center; padding: 0 11px;
    font-size: 12.5px; color: var(--dim); cursor: pointer; position: relative;
  }
  .subtab:hover { color: var(--fg); }
  .subtab.on { color: var(--accent2); font-weight: 500; }
  .subtab.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
  .sheet .dirty { margin-left: auto; font-size: 11.5px; color: var(--warn); display: none; align-items: center; gap: 5px; }

  /* ── 工具条 ── */
  .toolbar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; height: 36px;
    padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px;
    background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px;
    font-size: 11.5px; color: var(--fg2); white-space: nowrap;
  }
  .chip svg { width: 12px; height: 12px; color: var(--dim); }
  .chip b { color: var(--accent2); font-weight: 600; }
  .chip .x { cursor: pointer; color: var(--dim); line-height: 1; } .chip .x:hover { color: var(--danger); }
  .chip.link { cursor: pointer; color: var(--dim); border-style: dashed; background: transparent; }
  .chip.link:hover { color: var(--accent2); border-color: var(--accent); }
  .tbtn {
    display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px;
    border: none; background: transparent; border-radius: 6px;
    font-size: 12px; color: var(--fg2); cursor: pointer; white-space: nowrap;
  }
  .tbtn:hover { background: var(--hover); color: var(--fg); }
  .tbtn svg { width: 13px; height: 13px; color: var(--dim); }
  .tbtn.danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .toolbar .vsep { width: 1px; height: 16px; background: var(--line2); margin: 0 2px; }
  .search { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px;
    background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; color: var(--dim); width: 200px; }
  .search:focus-within { border-color: var(--accent); }
  .search input { border: none; outline: none; background: transparent; color: var(--fg); font-size: 12px; width: 100%; }
  .search svg { width: 12px; height: 12px; flex-shrink: 0; }
  .toolbar .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }

  /* ── 网格 ── */
  .grid { flex: 1; min-height: 0; overflow: auto; background: var(--panel); }
  table { border-collapse: separate; border-spacing: 0; font-size: 12px; min-width: max-content; }
  thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--panel2);
    height: 30px; padding: 0 10px;
    font-size: 11px; font-weight: 600; color: var(--fg2);
    text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--line2);
    cursor: pointer; user-select: none;
  }
  thead th:hover { background: var(--hover); }
  thead th .key { color: var(--ok); font-size: 10px; margin-left: 4px; vertical-align: 1px; }
  thead th .typ { color: var(--dim2); font-weight: 400; font-size: 9.5px; margin-left: 5px; letter-spacing: .02em; }
  thead th .dir { color: var(--accent2); font-size: 8.5px; margin-left: 2px; }
  thead th.sorted { color: var(--accent2); box-shadow: inset 0 -2px 0 var(--accent); }

  /* 行号列（左侧钉住） */
  th.rn, td.rn {
    position: sticky; left: 0; z-index: 2;
    background: var(--panel2);
    width: 44px; min-width: 44px; max-width: 44px;
    text-align: right; padding: 0 8px 0 6px;
    color: var(--dim2); font-size: 10.5px; font-variant-numeric: tabular-nums;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  thead th.rn { z-index: 4; }
  td.rn { cursor: pointer; }
  tr:hover td.rn { background: var(--hover); color: var(--dim); }
  tr.cur td.rn { background: color-mix(in srgb, var(--accent) 10%, var(--panel2)); color: var(--accent2); font-weight: 600; }

  td {
    height: 28px; padding: 0 10px;
    border-bottom: 1px solid var(--line); border-right: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    vertical-align: middle; cursor: cell;
  }
  tr:hover td { background: var(--hover); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 11.5px; }
  td .null { color: var(--dim2); font-style: italic; font-size: 11px; }
  td.pk-cell { color: var(--fg2); }

  /* 选中单元格：表格线级高亮 */
  td.sel { background: color-mix(in srgb, var(--accent) 8%, transparent) !important; box-shadow: inset 0 0 0 1.5px var(--accent); }
  td.sel.editing { padding: 0; }
  td.sel input { width: 100%; height: 100%; border: none; outline: none; background: var(--panel);
    padding: 0 10px; font: inherit; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--accent); }

  /* ── 底部状态条 ── */
  .status {
    flex-shrink: 0; height: 30px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 12px; background: var(--panel2); border-top: 1px solid var(--line2);
    font-size: 11.5px; color: var(--dim);
  }
  .status b { color: var(--fg2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .nav { display: flex; align-items: center; gap: 1px; }
  .nav button {
    width: 22px; height: 22px; border: none; background: transparent; border-radius: 5px;
    color: var(--dim); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .nav button:hover { background: var(--line); color: var(--fg); }
  .nav button:disabled { opacity: .3; cursor: default; }
  .nav svg { width: 12px; height: 12px; }
  .status .sep { width: 1px; height: 14px; background: var(--line2); }
  .pagesize { display: flex; align-items: center; gap: 5px; }
  .pagesize select {
    height: 20px; border: 1px solid var(--line2); border-radius: 5px; background: var(--panel);
    color: var(--fg2); font-size: 11px; outline: none; cursor: pointer;
  }
  .status .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .ins-hint { color: var(--ok); }

  .theme-toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
    border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--dim); font-size: 11px; cursor: pointer; }
  .theme-toggle:hover { background: var(--panel); color: var(--fg); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="appbar">
  <span class="dot" style="background:#ff5f57"></span>
  <span class="dot" style="background:#febc2e"></span>
  <span class="dot" style="background:#28c840"></span>
  <span style="width:10px"></span>
  <span class="tab">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/></svg>
    cym · PostgreSQL 16
  </span>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:12px;height:12px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span id="theme-label">深色模式</span>
  </button>
</div>

<div class="page">

  <!-- 表名 + 子页签 -->
  <div class="sheet">
    <span class="tbl">
      <svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M9 9.5V20"/></svg>
      <span class="schema">public.</span>tb_asset_dividend_history
    </span>
    <div class="subtabs">
      <span class="subtab on">数据</span>
      <span class="subtab">结构</span>
      <span class="subtab">索引</span>
      <span class="subtab">外键</span>
      <span class="subtab">DDL</span>
    </div>
    <span class="dirty" id="dirty"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke-linejoin="round"/></svg><span id="dirty-n">2</span> 处未提交</span>
  </div>

  <!-- 工具条 -->
  <div class="toolbar">
    <span class="chip"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M7 12h10M10 18h4"/></svg>排序 <b>asset_value ↓</b><span class="x">×</span></span>
    <span class="chip link" onclick="alert('打开 where 条件构建器')">＋ 条件</span>
    <span class="chip link">＋ 排序</span>
    <div class="vsep"></div>
    <label class="search">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="filter" type="text" placeholder="在结果中筛选…" oninput="render()" />
    </label>
    <div class="right">
      <button class="tbtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>插入行</button>
      <button class="tbtn danger"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>删除行</button>
      <div class="vsep"></div>
      <button class="tbtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>导出</button>
      <button class="tbtn"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3M21 4v5h-5"/></svg>刷新</button>
    </div>
  </div>

  <!-- 数据网格 -->
  <div class="grid" id="grid">
    <table id="tbl">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <!-- 底部状态条 -->
  <div class="status">
    <span>共 <b id="st-total">3,421</b> 行 · 已载入 <b id="st-loaded">40</b></span>
    <span class="sep"></span>
    <div class="nav">
      <button title="第一页"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m11 19-7-7 7-7M20 5v14"/></svg></button>
      <button title="上一页"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button title="下一页"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button title="最后一页"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m13 5 7 7-7 7M4 5v14"/></svg></button>
    </div>
    <span class="pagesize">每页
      <select><option>200</option><option>500</option><option>1000</option></select>
      行 · 第 <b>1</b> / <b id="st-pages">18</b> 页
    </span>
    <div class="right">
      <span class="ins-hint" id="st-hint">双击单元格可直接编辑</span>
      <span class="sep"></span>
      <span>行 <b id="st-row">—</b> · 列 <b id="st-col">—</b></span>
    </div>
  </div>

</div>

<script>
  // 列定义：k 名称 / t 类型标签 / a 对齐 / m mono / pk 主键
  const cols = [
    { k: "asset_dividend_id", t: "uuid",      m: 1, pk: 1 },
    { k: "user_id",           t: "int8",      m: 1 },
    { k: "super_node_id",     t: "int8",      m: 1 },
    { k: "asset_type",        t: "int4",      n: 1 },
    { k: "asset_value",       t: "numeric",   n: 1 },
    { k: "status",            t: "int4",      n: 1 },
    { k: "ref_order_id",      t: "varchar",   m: 1 },
    { k: "del_flag",          t: "int4",      n: 1 },
    { k: "update_by",         t: "int8" },
    { k: "create_by",         t: "int8",      m: 1 },
    { k: "update_time",       t: "timestamp", m: 1 },
    { k: "create_time",       t: "timestamp", m: 1 },
    { k: "asset_source",      t: "varchar" },
  ];

  const seedNames = ["202106226...", "MA4E965855220520260220...", "MA4E965855220520260722..."];
  function pad(n, l) { return String(n).padStart(l, "0"); }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function ts(r, c) { return `2026-0${rnd(4,6)}-${pad(rnd(10,28),2)} ${pad(rnd(8,20),2)}:${pad(rnd(0,59),2)}:${pad(rnd(0,59),2)}`; }

  const rows = [];
  for (let i = 1; i <= 40; i++) {
    rows.push({
      asset_dividend_id: [rnd(0,0xffff),rnd(0,0xffff),rnd(0,0xffff),rnd(0,0xffff),rnd(0,0xffff)].map(x=>pad(x.toString(16),4)).join("")+"91",
      user_id: rnd(0,3) === 0 ? 200050262310918635n : 200050262310918633n,
      super_node_id: 1,
      asset_type: 1,
      asset_value: [1.2,0.4,0.6,1,0.04,0.03,0.55,0.63,0.01,0.11,0.16,0.36,0.12,0.18,0.3,0.02,0.03,0.08,0.05,0.01,0.04,0.06,0.02,0.03,0.05,0.02,0.83,0.27,0.41,0.69,0.24,0.05,0.05,0.07,0.07,0.11,0.12,0.02][i-1] ?? 0.05,
      status: 2,
      ref_order_id: seedNames[i % 3] + pad(rnd(1,999999),6),
      del_flag: 2,
      update_by: i % 4 === 1 ? null : null,
      create_by: rnd(0,4)===0 ? 1796049000881n : 1796049000883n,
      update_time: ts(),
      create_time: ts(),
      asset_source: null,
    });
  }

  // 渲染表头
  document.getElementById("head").innerHTML =
    `<th class="rn">#</th>` +
    cols.map(c => {
      const sort = c.k === "asset_value" ? ' sorted' : '';
      const dir = c.k === "asset_value" ? '<span class="dir">▼</span>' : '';
      const key = c.pk ? '<span class="key">⚿</span>' : '';
      return `<th class="${sort}" onclick="sortHint('${c.k}')">${c.k}${key}<span class="typ">${c.t}</span>${dir}</th>`;
    }).join("");

  function fmt(v, c) {
    if (v === null || v === undefined) return '<span class="null">NULL</span>';
    return typeof v === "bigint" ? v.toString() : v;
  }

  let cur = null; // {r, c}
  function render() {
    const kw = document.getElementById("filter").value.trim().toLowerCase();
    const list = rows.map((r, i) => ({ r, i })).filter(x =>
      !kw || cols.some(c => String(x.r[c.k] ?? "").toLowerCase().includes(kw))
    );
    document.getElementById("st-loaded").textContent = list.length;

    document.getElementById("body").innerHTML = list.map(({ r, i }) =>
      `<tr class="${cur && cur.r === i ? "cur" : ""}">` +
      `<td class="rn">${i + 1}</td>` +
      cols.map((c, ci) => {
        const cls = [c.n ? "num" : "", c.m ? "mono" : "", c.pk ? "pk-cell" : ""].join(" ");
        const sel = cur && cur.r === i && cur.c === ci ? " sel" : "";
        return `<td class="${cls}${sel}" onclick="pick(${i},${ci})" ondblclick="edit(${i},${ci})">${fmt(r[c.k], c)}</td>`;
      }).join("") +
      `</tr>`
    ).join("");
  }

  function pick(r, c) {
    cur = { r, c };
    document.getElementById("st-row").textContent = r + 1;
    document.getElementById("st-col").textContent = c + 1;
    document.getElementById("st-hint").textContent = "";
    render();
  }

  // 双击进入编辑态
  function edit(r, c) {
    cur = { r, c };
    render();
    const td = document.querySelector(`#body tr:nth-child(${[...rows].slice(0, r + 1).filter(x => true).length && r + 1}) td:nth-child(${c + 2})`);
    if (!td) return;
    const col = cols[c];
    const raw = rows[r][col.k];
    td.classList.add("editing");
    td.innerHTML = `<input value="${raw ?? ""}" />`;
    const inp = td.querySelector("input");
    inp.focus(); inp.select();
    inp.onblur = () => { rows[r][col.k] = inp.value === "" ? null : (typeof raw === "bigint" ? BigInt(inp.value || 0) : inp.value); dirty(); render(); };
    inp.onkeydown = (e) => { if (e.key === "Enter") inp.blur(); if (e.key === "Escape") { inp.onblur = null; render(); } };
  }

  let dirtyCount = 0;
  function dirty() {
    dirtyCount++;
    document.getElementById("dirty").style.display = "inline-flex";
    document.getElementById("dirty-n").textContent = dirtyCount;
    document.getElementById("st-hint").textContent = "";
    document.getElementById("st-hint").className = "";
    document.getElementById("st-hint").innerHTML = `<b style="color:var(--warn)">${dirtyCount} 处修改待提交</b>`;
  }

  function sortHint(k) {
    document.getElementById("st-hint").className = "";
    document.getElementById("st-hint").innerHTML = `<b style="color:var(--accent2)">${k}</b>`;
  }

  function toggleTheme() {
    const root = document.documentElement;
    const dark = root.getAttribute("data-theme") === "dark";
    root.setAttribute("data-theme", dark ? "" : "dark");
    document.getElementById("theme-label").textContent = dark ? "深色模式" : "浅色模式";
  }

  render();
</script>
</body>
</html>
