<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>序列 · 重构设计稿（朴素版）</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel2: #f1f3f6;
    --line: #e5e8ee;
    --line2: #d6dbe4;
    --fg: #1c2330;
    --fg2: #4a5568;
    --dim: #8a94a6;
    --dim2: #a8b1c0;
    --accent: #3b82f6;
    --accent2: #2563eb;
    --ok: #16a34a;
    --radius: 8px;
    --shadow: 0 1px 2px rgb(16 24 40 / .04), 0 4px 16px rgb(16 24 40 / .06);
  }
  [data-theme="dark"] {
    --bg: #12151b;
    --panel: #1a1f28;
    --panel2: #212836;
    --line: #2a3242;
    --line2: #384257;
    --fg: #e8ecf3;
    --fg2: #b7c0d0;
    --dim: #7d8899;
    --dim2: #5d6779;
    --accent: #4d8dff;
    --accent2: #3b7bf0;
    --ok: #34d07c;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg); font-size: 13px;
    transition: background .2s, color .2s;
  }
  .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }

  .appbar {
    height: 36px; background: var(--panel2); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; padding: 0 12px; user-select: none;
  }
  .appbar .dot { width: 10px; height: 10px; border-radius: 50%; }
  .appbar .tab {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    font-size: 12px; color: var(--fg2);
  }
  .appbar .tab svg { width: 12px; height: 12px; }

  .page {
    height: calc(100vh - 36px);
    display: flex; flex-direction: column;
    padding: 14px 16px; gap: 10px;
    max-width: 1480px; margin: 0 auto;
  }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .toolbar h1 { font-size: 14px; font-weight: 600; }
  .toolbar .count { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .search {
    display: flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 10px;
    background: var(--panel); border: 1px solid var(--line2); border-radius: 7px;
    color: var(--dim); width: 240px;
    transition: border-color .15s;
  }
  .search:focus-within { border-color: var(--accent); }
  .search input { border: none; outline: none; background: transparent; color: var(--fg); font-size: 12.5px; width: 100%; }
  .search svg { width: 13px; height: 13px; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 11px;
    border-radius: 7px; border: 1px solid var(--line2);
    background: var(--panel); color: var(--fg2);
    font-size: 12.5px; cursor: pointer; white-space: nowrap;
    transition: all .15s;
  }
  .btn:hover { background: var(--panel2); border-color: var(--dim2); }
  .btn svg { width: 13px; height: 13px; }
  .btn-primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); }

  .main { display: flex; gap: 10px; flex: 1; min-height: 0; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }
  .card-left { flex: 1.6; min-width: 0; }
  .card-right { flex: 1; min-width: 340px; max-width: 460px; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--panel2);
    font-size: 11px; font-weight: 500; color: var(--dim);
    text-align: left; padding: 6px 12px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
    vertical-align: middle;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  tbody tr { cursor: pointer; transition: background .1s; }
  tbody tr:hover { background: var(--panel2); }
  tbody tr.active { background: color-mix(in srgb, var(--accent) 8%, transparent); box-shadow: inset 2px 0 0 var(--accent); }
  tbody tr:last-child td { border-bottom: none; }

  td .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td .cmt { color: var(--dim); font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 右侧详情：纯文字 */
  .det-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .det-head .n { font-size: 13.5px; font-weight: 600; }
  .det-head .c { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .det-head .next {
    margin-top: 10px; font-size: 12px; color: var(--fg2);
    display: flex; align-items: baseline; gap: 8px;
  }
  .det-head .next b { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }

  .det-body { padding: 10px 14px; overflow: auto; flex: 1; min-height: 0; }
  .sec { font-size: 11px; color: var(--dim); padding: 4px 0 6px; }

  /* 属性用普通两列小表 */
  .kv-table { width: 100%; border-collapse: collapse; }
  .kv-table td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .kv-table tr:last-child td { border-bottom: none; }
  .kv-table .k { color: var(--dim); width: 45%; }
  .kv-table .v { font-variant-numeric: tabular-nums; }

  .det-foot {
    display: flex; gap: 2px;
    padding: 8px 10px;
    border-top: 1px solid var(--line);
    background: var(--panel2);
    flex-shrink: 0;
  }
  .txt-btn {
    height: 20px; padding: 0 7px;
    border: none; background: transparent; border-radius: 5px;
    color: var(--fg2); font-size: 11.5px; cursor: pointer; white-space: nowrap;
    transition: all .12s;
  }
  .txt-btn:hover { background: var(--panel); color: var(--fg); }
  .txt-btn:disabled { opacity: .4; cursor: default; }
  .txt-btn.danger:hover { background: var(--panel); color: #dc2626; }
  [data-theme="dark"] .txt-btn.danger:hover { color: #f2635c; }

  .scroll-area { overflow: auto; flex: 1; min-height: 0; }

  .theme-toggle {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 10px;
    border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: var(--dim);
    font-size: 11px; cursor: pointer;
  }
  .theme-toggle:hover { background: var(--panel); color: var(--fg); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="appbar">
  <span class="dot" style="background:#ff5f57"></span>
  <span class="dot" style="background:#febc2e"></span>
  <span class="dot" style="background:#28c840"></span>
  <span style="width:10px"></span>
  <span class="tab">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/></svg>
    cym · gen_quartz
  </span>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:12px;height:12px"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span id="theme-label">深色模式</span>
  </button>
</div>

<div class="page">

  <div class="toolbar">
    <h1>gen_quartz · 序列</h1>
    <span class="count" id="count">6 个序列</span>
    <label class="search" style="margin-left:auto">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="filter" type="text" placeholder="筛选序列名" oninput="render()" />
    </label>
    <button class="btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3M21 4v5h-5"/></svg>
      刷新
    </button>
    <button class="btn btn-primary">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      新建序列
    </button>
  </div>

  <div class="main">

    <!-- 左：序列清单 -->
    <div class="card card-left">
      <div class="scroll-area">
        <table>
          <colgroup>
            <col style="width:38%" />
            <col style="width:26%" />
            <col style="width:14%" />
            <col style="width:10%" />
            <col style="width:12%" />
          </colgroup>
          <thead>
            <tr>
              <th>序列名</th>
              <th>说明</th>
              <th>当前值</th>
              <th>步长</th>
              <th>循环</th>
            </tr>
          </thead>
          <tbody id="seq-rows"></tbody>
        </table>
      </div>
    </div>

    <!-- 右：序列详情（纯文字） -->
    <div class="card card-right">
      <div class="det-head">
        <div class="n mono" id="det-name">gen_field_type_id_seq</div>
        <div class="c" id="det-cmt">gen_field_type · id 列自增主键</div>
        <div class="next">下一个值 <b class="mono" id="det-next">33</b></div>
      </div>
      <div class="det-body">
        <div class="sec">属性</div>
        <table class="kv-table">
          <tbody id="det-kv"></tbody>
        </table>
      </div>
      <div class="det-foot">
        <button class="txt-btn">取下一个值</button>
        <button class="txt-btn">设置当前值…</button>
        <button class="txt-btn">重命名</button>
        <button class="txt-btn danger" style="margin-left:auto">删除</button>
      </div>
    </div>

  </div>
</div>

<script>
  // name / owner(说明) / cur 当前值 / min / max / step / cycle / cache / last(是否被表使用)
  const seqs = [
    { name: "gen_dataource_conf_id_seq",  owner: "gen_dataource_conf · id 自增",  cur: 1,  min: 1, max: "9223372036854775807", step: 1, cycle: false, cache: 1 },
    { name: "gen_field_type_id_seq",      owner: "gen_field_type · id 自增",      cur: 32, min: 1, max: "9223372036854775807", step: 1, cycle: false, cache: 1 },
    { name: "gen_group_id_seq",           owner: "gen_group · id 自增",           cur: 1,  min: 1, max: "9223372036854775807", step: 1, cycle: false, cache: 1 },
    { name: "gen_table_id_seq",           owner: "gen_table · id 自增",           cur: 1,  min: 1, max: "9223372036854775807", step: 1, cycle: false, cache: 1 },
    { name: "gen_table_column_id_seq",    owner: "gen_table_column · id 自增",    cur: 1,  min: 1, max: "9223372036854775807", step: 1, cycle: false, cache: 1 },
    { name: "gen_template_id_seq",        owner: "gen_template · id 自增",        cur: 1,  min: 1, max: "9223372036854775807", step: 1, cycle: false, cache: 1 },
  ];

  let selected = "gen_field_type_id_seq";

  function render() {
    const kw = document.getElementById("filter").value.trim().toLowerCase();
    const list = seqs.filter(s => !kw || s.name.toLowerCase().includes(kw));
    document.getElementById("count").textContent = list.length + " 个序列";

    document.getElementById("seq-rows").innerHTML = list.map(s => `
      <tr class="${s.name === selected ? "active" : ""}" onclick="select('${s.name}')">
        <td><div class="name mono">${s.name}</div></td>
        <td><span class="cmt">${s.owner}</span></td>
        <td class="num">${s.cur}</td>
        <td class="num">${s.step}</td>
        <td class="cmt">${s.cycle ? "是" : "否"}</td>
      </tr>
    `).join("") || '<tr><td colspan="5" style="color:var(--dim2);text-align:center;padding:30px 0">无匹配</td></tr>';
  }

  function select(name) {
    selected = name;
    render();
    const s = seqs.find(x => x.name === name);
    document.getElementById("det-name").textContent = s.name;
    document.getElementById("det-cmt").textContent = s.owner;
    document.getElementById("det-next").textContent = s.cur + s.step;
    const rows = [
      ["当前值", s.cur],
      ["最小值", s.min],
      ["最大值", s.max],
      ["步长（增量）", s.step],
      ["缓存", s.cache],
      ["循环", s.cycle ? "是" : "否"],
      ["所属列", s.owner.split(" · ")[0] + ".id"],
    ];
    document.getElementById("det-kv").innerHTML = rows.map(([k, v]) => `
      <tr><td class="k">${k}</td><td class="v mono">${v}</td></tr>
    `).join("");
  }

  function toggleTheme() {
    const root = document.documentElement;
    const dark = root.getAttribute("data-theme") === "dark";
    root.setAttribute("data-theme", dark ? "" : "dark");
    document.getElementById("theme-label").textContent = dark ? "深色模式" : "浅色模式";
  }

  render();
  select("gen_field_type_id_seq");
</script>
</body>
</html>
